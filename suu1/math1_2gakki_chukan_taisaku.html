function sig(q){return q.id||q.q.replace(/<[^>]+>/g,'')+'|'+q.a.join('|')}function newQ(){$('#fracModal').classList.add('hide');let z,n=0;do{z=make();n++}while(hist.includes(sig(z))&&n<50);p=z;hist.push(sig(p));if(hist.length>2)hist.shift();if(stage===0)stage0Shown++;if(stage===6)stage6Shown++;if(stage===7)stage7Shown++;graphPoints=[];graphUnlocked=false;vals=p.f.map(()=> '');active=0;done=false;$('#title').textContent=`大問${stage+1}　${names[stage]}`;$('#question').innerHTML=p.q;fields();$('#special').classList.remove('hide');$('#special').innerHTML=p.choice?'<div class="row"><button class="choice" onclick="choose(2)">2個</button><button class="choice" onclick="choose(1)">1個（重解）</button><button class="choice" onclick="choose(0)">0個</button></div>':(p.graph?'<div class="graph-area"><div class="answer-confirmed">頂点と軸は正解です。入力した値を見ながらグラフ上の点を取ってください。</div><h3>グラフ作図</h3><canvas id="graphCanvas" class="graph-canvas" width="620" height="440"></canvas><div class="graph-guide">1点目に頂点、2点目に放物線上の頂点以外の格子点をタップしてください。y切片でも、頂点から右へ1進んだ点などでも構いません。座標範囲は頂点とy切片が見えるように自動調整されます。タップした2点から放物線を描きます。3回目のタップで点とグラフをすべて消し、置き直せます。</div><div id="graphStatus" class="graph-status">まだ点が置かれていません。</div><div class="graph-check-row"><button class="btn blue" onclick="grade()">グラフを確認</button></div></div>':'');if(p.graph)$('#special').classList.add('hide');$('#answers').classList.toggle('hide',!!p.choice);$('#entry').classList.toggle('hide',!!p.choice);$('#fb').className='feedback hide';$('#primaryBtn').textContent=p.graph?'頂点と軸を確認':'答えを確認';resetMemo();stats()}function fieldValue(i,placeholder='入力'){return vals[i]?displayMath(vals[i]):placeholder}
function fields(){if(p.layout==='vertexAxis'){$('#answers').innerHTML=`<div class="vertex-axis"><div class="vertex-line"><span>頂点</span><span class="coord-mark">（</span><div class="coord-field ${active===0&&!graphUnlocked?'on':''} ${graphUnlocked?'locked':''}" onclick="if(!graphUnlocked){active=0;fields()}">${fieldValue(0,'x座標')}</div><span class="coord-mark">,</span><div class="coord-field ${active===1&&!graphUnlocked?'on':''} ${graphUnlocked?'locked':''}" onclick="if(!graphUnlocked){active=1;fields()}">${fieldValue(1,'y座標')}</div><span class="coord-mark">）</span></div><div class="axis-line"><span>軸　x =</span><div class="axis-field ${active===2&&!graphUnlocked?'on':''} ${graphUnlocked?'locked':''}" onclick="if(!graphUnlocked){active=2;fields()}">${fieldValue(2,'数値')}</div></div></div>`}else if(p.layout==='maxMin'||p.layout==='domainMaxMin'){const domain=p.layout==='domainMaxMin',ph=domain?'数値':'数値または「なし」';$('#answers').innerHTML=`<div class="maxmin-grid"><div class="maxmin-row"><span class="maxmin-label">最大値</span><div class="maxmin-field ${active===0?'on':''}" onclick="active=0;fields()">${fieldValue(0,ph)}</div><span class="maxmin-label maxmin-xlabel">そのとき　x =</span><div class="maxmin-field ${!domain&&vals[0]==='なし'?'disabled':(active===1?'on':'')}" onclick="if(p.layout==='domainMaxMin'||vals[0]!=='なし'){active=1;fields()}">${!domain&&vals[0]==='なし'?'入力不要':fieldValue(1,'数値')}</div></div><div class="maxmin-row"><span class="maxmin-label">最小値</span><div class="maxmin-field ${active===2?'on':''}" onclick="active=2;fields()">${fieldValue(2,ph)}</div><span class="maxmin-label maxmin-xlabel">そのとき　x =</span><div class="maxmin-field ${!domain&&vals[2]==='なし'?'disabled':(active===3?'on':'')}" onclick="if(p.layout==='domainMaxMin'||vals[2]!=='なし'){active=3;fields()}">${!domain&&vals[2]==='なし'?'入力不要':fieldValue(3,'数値')}</div></div></div>`}else{$('#answers').innerHTML=p.f.map((f,i)=>`<div class="fr"><span class="lab">${f[0]}</span><div class="fld ${i===active?'on':''}" onclick="active=${i};fields()">${fieldValue(i,f[1]||'入力')}</div></div>`).join('')}keys()}
function keys(){let a=['7','8','9','(',')','4','5','6','x','²','1','2','3','+','−','0',',','分数','√','±','y','=','⌫'];if(p.layout==='maxMin')a.push('なし');$('#keys').innerHTML=a.map(x=>`<button class="key ${x==='なし'?'none-key':''}" onclick="press('${x}')">${x}</button>`).join('')}function press(x){if(x==='分数'){openFraction();return}if(x==='なし'){vals[active]='なし';if(p.layout==='maxMin'&&active===0)vals[1]='なし';if(p.layout==='maxMin'&&active===2)vals[3]='なし';fields();return}if(vals[active]==='なし'){vals[active]='';if(p.layout==='maxMin'&&active===0)vals[1]='';if(p.layout==='maxMin'&&active===2)vals[3]=''}vals[active]=x==='⌫'?vals[active].slice(0,-1):vals[active]+(x==='²'?'^2':x);fields()}function openFraction(){fracNum='';fracDen='';fracPart='num';renderFraction();$('#fracModal').classList.remove('hide')}
function closeFraction(){$('#fracModal').classList.add('hide')}
function selectFracPart(part){fracPart=part;renderFraction()}
function renderFraction(){$('#fracNum').classList.toggle('on',fracPart==='num');$('#fracDen').classList.toggle('on',fracPart==='den');$('#fracNum').innerHTML=fracNum?displayMath(fracNum):'分子';$('#fracDen').innerHTML=fracDen?displayMath(fracDen):'分母';const ks=['7','8','9','x','⌫','4','5','6','+','−','1','2','3','√','±','0','(',')','²','消去'];$('#fracPad').innerHTML=ks.map(k=>`<button onclick="fracKey('${k}')">${k}</button>`).join('')}
function fracKey(k){let v=fracPart==='num'?fracNum:fracDen;if(k==='⌫')v=v.slice(0,-1);else if(k==='消去')v='';else v+=k==='²'?'^2':k;if(fracPart==='num')fracNum=v;else fracDen=v;renderFraction()}
function insertFraction(){if(!fracNum||!fracDen)return;const simple=/^[+−-]?\d+$/.test(fracNum),token=simple?`${fracNum}/${fracDen}`:`(${fracNum})/${fracDen}`;vals[active]+=token;closeFraction();fields()}
function graphView(){const y0=p.A*p.h*p.h+p.k,minX=Math.min(0,p.h),maxX=Math.max(0,p.h),minY=Math.min(p.k,y0),maxY=Math.max(p.k,y0),padX=2,padY=2,spanX=Math.max(8,(maxX-minX+2*padX)*2),spanY=Math.max(8,(maxY-minY+2*padY)*2),unit=Math.max(12,Math.min(40,620/spanX,440/spanY)),cx=(minX+maxX)/2,cy=(minY+maxY)/2;return{unit,cx,cy,y0}}
function initGraph(){drawGraph();const c=$('#graphCanvas');if(!c)return;c.onpointerdown=e=>{const r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height,px=(e.clientX-r.left)*sx,py=(e.clientY-r.top)*sy,{unit,cx,cy}=graphView(),x=Math.round(cx+(px-c.width/2)/unit),y=Math.round(cy+(c.height/2-py)/unit);if(graphPoints.length>=2){graphPoints=[];drawGraph();return}graphPoints.push([x,y]);drawGraph()}}
function drawGraph(){const c=$('#graphCanvas');if(!c)return;const g=c.getContext('2d'),W=c.width,H=c.height,{unit,cx,cy}=graphView(),toX=x=>W/2+(x-cx)*unit,toY=y=>H/2-(y-cy)*unit,fromPX=px=>cx+(px-W/2)/unit;g.clearRect(0,0,W,H);g.strokeStyle='#dfe6ef';g.lineWidth=1;const xmin=Math.floor(cx-W/(2*unit))-1,xmax=Math.ceil(cx+W/(2*unit))+1,ymin=Math.floor(cy-H/(2*unit))-1,ymax=Math.ceil(cy+H/(2*unit))+1;for(let x=xmin;x<=xmax;x++){g.beginPath();g.moveTo(toX(x),0);g.lineTo(toX(x),H);g.stroke()}for(let y=ymin;y<=ymax;y++){g.beginPath();g.moveTo(0,toY(y));g.lineTo(W,toY(y));g.stroke()}g.strokeStyle='#506176';g.lineWidth=2;if(toY(0)>=0&&toY(0)<=H){g.beginPath();g.moveTo(0,toY(0));g.lineTo(W,toY(0));g.stroke()}if(toX(0)>=0&&toX(0)<=W){g.beginPath();g.moveTo(toX(0),0);g.lineTo(toX(0),H);g.stroke()}g.fillStyle='#506176';g.font='13px sans-serif';for(let x=xmin;x<=xmax;x++)if(x!==0&&toX(x)>10&&toX(x)<W-10)g.fillText(x,toX(x)-5,Math.min(H-6,Math.max(16,toY(0)+16)));for(let y=ymin;y<=ymax;y++)if(y!==0&&toY(y)>10&&toY(y)<H-8)g.fillText(y,Math.min(W-24,Math.max(6,toX(0)+6)),toY(y)+4);graphPoints.forEach((pt,i)=>{g.fillStyle=i===0?'#cf3030':'#2468d2';g.beginPath();g.arc(toX(pt[0]),toY(pt[1]),7,0,Math.PI*2);g.fill();g.font='14px sans-serif';g.fillText(`(${pt[0]},${pt[1]})`,toX(pt[0])+10,toY(pt[1])-8)});let userA=null;if(graphPoints.length===2){const v=graphPoints[0],q=graphPoints[1],dx=q[0]-v[0];if(dx!==0)userA=(q[1]-v[1])/(dx*dx);if(userA!==null&&userA!==0){g.strokeStyle='#1c8a55';g.lineWidth=3;g.beginPath();for(let px=0;px<W;px++){const x=fromPX(px),y=userA*(x-v[0])**2+v[1],yy=toY(y);if(px===0)g.moveTo(px,yy);else g.lineTo(px,yy)}g.stroke();g.setLineDash([6,5]);g.strokeStyle='#cf3030';g.lineWidth=1.5;g.beginPath();g.moveTo(toX(v[0]),0);g.lineTo(toX(v[0]),H);g.stroke();g.setLineDash([])}}const st=$('#graphStatus');if(st){if(graphPoints.length===0)st.textContent='まだ点が置かれていません。';else if(graphPoints.length===1)st.innerHTML=`<span class="point-red">頂点候補：(${graphPoints[0][0]}, ${graphPoints[0][1]})</span>　放物線上の別の格子点をタップしてください。`;else if(userA===null||userA===0)st.innerHTML='<span class="graph-warning">頂点とはx座標が異なる、放物線上の格子点を選んでください。</span>';else st.innerHTML=`<span class="point-red">頂点候補：(${graphPoints[0][0]}, ${graphPoints[0][1]})</span>　<span class="point-blue">もう1点：(${graphPoints[1][0]}, ${graphPoints[1][1]})</span>`}}
function drawAnswerGraph(){const c=$('#answerGraph');if(!c||!p.graph)return;const g=c.getContext('2d'),W=c.width,H=c.height,{unit,cx,cy}=graphView(),toX=x=>W/2+(x-cx)*unit,toY=y=>H/2-(y-cy)*unit,fromPX=px=>cx+(px-W/2)/unit;g.clearRect(0,0,W,H);g.strokeStyle='#dfe6ef';g.lineWidth=1;const xmin=Math.floor(cx-W/(2*unit))-1,xmax=Math.ceil(cx+W/(2*unit))+1,ymin=Math.floor(cy-H/(2*unit))-1,ymax=Math.ceil(cy+H/(2*unit))+1;for(let x=xmin;x<=xmax;x++){g.beginPath();g.moveTo(toX(x),0);g.lineTo(toX(x),H);g.stroke()}for(let y=ymin;y<=ymax;y++){g.beginPath();g.moveTo(0,toY(y));g.lineTo(W,toY(y));g.stroke()}g.strokeStyle='#506176';g.lineWidth=2;if(toY(0)>=0&&toY(0)<=H){g.beginPath();g.moveTo(0,toY(0));g.lineTo(W,toY(0));g.stroke()}if(toX(0)>=0&&toX(0)<=W){g.beginPath();g.moveTo(toX(0),0);g.lineTo(toX(0),H);g.stroke()}g.fillStyle='#506176';g.font='13px sans-serif';for(let x=xmin;x<=xmax;x++)if(x!==0&&toX(x)>10&&toX(x)<W-10)g.fillText(x,toX(x)-5,Math.min(H-6,Math.max(16,toY(0)+16)));for(let y=ymin;y<=ymax;y++)if(y!==0&&toY(y)>10&&toY(y)<H-8)g.fillText(y,Math.min(W-24,Math.max(6,toX(0)+6)),toY(y)+4);g.strokeStyle='#1c8a55';g.lineWidth=3;g.beginPath();for(let px=0;px<W;px++){const x=fromPX(px),y=p.A*(x-p.h)**2+p.k,yy=toY(y);if(px===0)g.moveTo(px,yy);else g.lineTo(px,yy)}g.stroke();const y0=p.A*p.h*p.h+p.k;[[p.h,p.k,'#cf3030'],[0,y0,'#2468d2']].forEach(pt=>{g.fillStyle=pt[2];g.beginPath();g.arc(toX(pt[0]),toY(pt[1]),7,0,Math.PI*2);g.fill();g.font='14px sans-serif';g.fillText(`(${pt[0]},${pt[1]})`,toX(pt[0])+10,toY(pt[1])-8)});g.setLineDash([6,5]);g.strokeStyle='#cf3030';g.lineWidth=1.5;g.beginPath();g.moveTo(toX(p.h),0);g.lineTo(toX(p.h),H);g.stroke();g.setLineDash([])}
function graphOkay(){if(!p.graph)return true;if(graphPoints.length!==2)return false;const v=graphPoints[0],q=graphPoints[1],dx=q[0]-v[0];if(dx===0)return false;const correctY=p.A*(q[0]-p.h)**2+p.k,userA=(q[1]-v[1])/(dx*dx);return v[0]===p.h&&v[1]===p.k&&q[0]!==p.h&&q[1]===correctY&&userA===p.A}
function clearField(){vals[active]='';fields()}function choose(n){vals[0]=String(n);grade()}function norm(x){return x.replace(/\s/g,'').replace(/−/g,'-').replace(/²/g,'^2').replace(/\(([+-]?\d+\/\d+)\)/g,'$1')}function okay(){if(p.u)return vals.map(norm).sort().join('|')===p.a.map(norm).sort().join('|');if(p.layout==='maxMin'){const v=[...vals];if(v[0]==='なし')v[1]='なし';if(v[2]==='なし')v[3]='なし';return v.every((x,i)=>norm(x)===norm(p.a[i]))}return vals.every((x,i)=>norm(x)===norm(p.a[i]))}function axisAnswersOkay(){return vals.length>=3&&vals.every((x,i)=>norm(x)===norm(p.a[i]))}
function handlePrimary(){if(!p.graph){grade();return}if(vals.some(v=>!v))return;if(!axisAnswersOkay()){tries++;streak=0;if(stage===5)stage5Shown=0;if(stage===6)stage6Shown=0;if(stage===7)stage7Shown=0;done=true;$('#entry').classList.add('hide');$('#fb').className='feedback ng';$('#fb').innerHTML=`<b>❌ 頂点または軸が違います</b><br>正しい答え：頂点（${p.a[0]}, ${p.a[1]}）、軸 x=${p.a[2]}<br>${p.e}<br><button class="btn blue" onclick="after()">次の問題</button>`;stats();return}graphUnlocked=true;fields();$('#entry').classList.add('hide');$('#special').classList.remove('hide');setTimeout(initGraph,0);$('#special').scrollIntoView({behavior:'smooth',block:'start'})}
function grade(){if(done||vals.some(v=>!v)||(p.graph&&!graphUnlocked))return;tries++;let ok=okay()&&graphOkay();done=true;if(ok){streak++;correct++}else{streak=0;if(stage===5)stage5Shown=0;if(stage===6)stage6Shown=0;if(stage===7)stage7Shown=0}$('#entry').classList.add('hide');$('#special').classList.add('hide');$('#fb').className='feedback '+(ok?'ok':'ng');$('#fb').innerHTML=`<b>${ok?'✅ 正解！':'❌ 不正解'}</b><br>${ok?'':`正しい答え：${p.a.map(displayMath).join('，')}<br>${p.graph?'頂点と、放物線上の頂点以外の格子点を正しく置いてください。<br>':''}`}${p.e}<br><button class="btn blue" onclick="after()">${streak>=3?'一覧へ':'次の問題'}</button>${p.graph?'<div class="answer-graph-wrap"><h4>正しいグラフ</h4><canvas id="answerGraph" class="answer-graph" width="620" height="440"></canvas><div class="graph-guide">赤：頂点　青：y切片</div></div>':''}`;if(p.graph)setTimeout(drawAnswerGraph,0);stats()}function after(){streak>=3?home():newQ()}function stats(){$('#streak').textContent=`${streak}/3`;$('#correct').textContent=correct;$('#tries').textContent=tries;$('#bar').style.width=(streak/3*100)+'%'}
const memo=$('#memo'),mc=memo.getContext('2d');let strokes=[],stroke,drawing=false,color='#172033',width=3;function sizeMemo(){let r=memo.getBoundingClientRect(),d=devicePixelRatio||1;memo.width=r.width*d;memo.height=r.height*d;mc.setTransform(d,0,0,d,0,0);redraw()}function resetMemo(){strokes=[];setTimeout(sizeMemo,0)}function pos(e){let r=memo.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}function redraw(){let r=memo.getBoundingClientRect();mc.fillStyle='#fff';mc.fillRect(0,0,r.width,r.height);strokes.forEach(s=>{if(s.p.length<2)return;mc.strokeStyle=s.c;mc.lineWidth=s.w;mc.lineCap='round';mc.beginPath();mc.moveTo(...s.p[0]);s.p.slice(1).forEach(p=>mc.lineTo(...p));mc.stroke()})}memo.onpointerdown=e=>{drawing=true;stroke={c:color,w:width,p:[pos(e)]};strokes.push(stroke)};memo.onpointermove=e=>{if(drawing){stroke.p.push(pos(e));redraw()}};memo.onpointerup=()=>drawing=false;function pen(c,w){color=c;width=w}function undoMemo(){strokes.pop();redraw()}function clearMemo(){strokes=[];redraw()}function toggleMemo(){$('#memoArea').classList.toggle('hide');if(!$('#memoArea').classList.contains('hide'))sizeMemo()}render();
