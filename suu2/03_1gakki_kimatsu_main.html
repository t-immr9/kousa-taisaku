<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数Ⅱ１学期期末対策 魔法陣クエスト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0f172a;
    --bg-panel: #1e293b;
    --text-main: #f8fafc;
    --text-sub: #c4b5fd;
    --accent-purple: #8b5cf6;
    --correct-bg: #064e3b;
    --correct-border: #10b981;
    --wrong-bg: #7f1d1d;
    --wrong-border: #ef4444;
  }
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #020617 0%, var(--bg-dark) 100%);
    color: var(--text-main);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #app {
    position: relative;
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    background: rgba(15, 23, 42, 0.8);
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }
  .hidden { display: none !important; }
  
  /* Buttons */
  button {
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    border-radius: 8px;
    font-weight: bold;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(to right, #6d28d9, #4c1d95);
    color: white;
    border: 2px solid #8b5cf6;
    padding: 12px 24px;
    font-size: 1.1rem;
    width: 100%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .btn-primary:hover { filter: brightness(1.2); }
  
  /* Screens */
  .screen {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  
  /* Title Screen */
  #sTitle {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .floating-icon {
    font-size: 5rem;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  
  /* Game Screen */
  #status-bar {
    position: sticky;
    top: 0;
    background: rgba(30, 41, 59, 0.95);
    padding: 15px;
    border-radius: 0 0 12px 12px;
    border-bottom: 2px solid var(--accent-purple);
    z-index: 10;
    margin-bottom: 20px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .stat-label { font-size: 0.9rem; color: var(--text-sub); }
  .bar-bg {
    flex: 1;
    height: 10px;
    background: #334155;
    border-radius: 5px;
    margin: 0 10px;
    overflow: hidden;
  }
  .hp-fill { height: 100%; background: #10b981; transition: width 0.3s, background-color 0.3s; }
  .exp-fill { height: 100%; background: #fbbf24; transition: width 0.3s; }
  
  #progress-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
  .dot.current { background: #fbbf24; box-shadow: 0 0 5px #fbbf24; }
  .dot.ok { background: #10b981; }
  .dot.ng { background: #ef4444; }

  .q-card {
    background: var(--bg-panel);
    border-radius: 12px;
    padding: 20px;
    border-top: 3px solid var(--accent-purple);
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }
  .q-header {
    color: var(--text-sub);
    font-size: 0.9rem;
    margin-bottom: 10px;
    border-bottom: 1px solid #334155;
    padding-bottom: 5px;
  }
  #qText {
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 20px;
    min-height: 80px;
  }
  
  .c-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .c-btn {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text-main);
    padding: 12px 15px;
    text-align: left;
    display: flex;
    align-items: center;
    border-radius: 8px;
    font-size: 1.05rem;
  }
  .c-btn:hover:not(:disabled) { border-color: var(--accent-purple); background: #1e293b; }
  .c-btn:disabled { cursor: default; }
  .c-badge {
    background: #334155;
    color: var(--text-sub);
    width: 28px; height: 28px;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 12px;
    font-weight: bold;
    flex-shrink: 0;
  }
  
  .c-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); }
  .c-btn.correct .c-badge { background: var(--correct-border); color: #fff; }
  .c-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
  .c-btn.wrong .c-badge { background: var(--wrong-border); color: #fff; }

  #exBox {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    font-size: 1rem;
    line-height: 1.6;
  }
  #exBox.ex-ok { background: rgba(6, 78, 59, 0.4); border: 1px solid var(--correct-border); }
  #exBox.ex-ng { background: rgba(127, 29, 29, 0.4); border: 1px solid var(--wrong-border); }

  /* Popups */
  .popup {
    position: absolute;
    font-weight: bold;
    font-size: 1.5rem;
    pointer-events: none;
    animation: popUp 1s forwards;
    z-index: 100;
    text-shadow: 2px 2px 0 #000;
  }
  .pop-exp { color: #fbbf24; }
  .pop-hp { color: #ef4444; }
  @keyframes popUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
    50% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }
  @keyframes flashRed {
    0% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
    50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
    100% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
  }
  .flash-anim { animation: flashRed 0.5s; }

  /* Level Up / Result */
  #sLvUp, #sResult {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .lv-box {
    background: var(--bg-panel);
    border: 2px solid #fbbf24;
    border-radius: 12px;
    padding: 30px;
    width: 100%;
    box-sizing: border-box;
  }
  .star-anim { font-size: 3rem; animation: float 2s infinite; margin-bottom: 10px; }
  .res-stats { font-size: 1.2rem; margin: 20px 0; line-height: 1.8; color: var(--text-sub); }
</style>

window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },

};
</script>

</head>
<body>
<div id="app">

  <div id="sTitle" class="screen">
    <div class="floating-icon">🧙‍♂️📖</div>
    <h1 style="margin-bottom: 10px;">数Ⅱ期末対策<br>魔法陣クエスト</h1>
    <p style="color: var(--text-sub); margin-bottom: 20px;">〜基礎の魔導書から奥義まで〜</p>
    <div style="display:flex; gap:12px; flex-direction:column; width:100%; margin-bottom:40px;">
      <button class="btn-primary" onclick="startStage(1)">⚔️ Stage 1：基礎の問題から挑む</button>
      <button class="btn-primary" style="background:linear-gradient(to right,#7c3aed,#4c1d95); border-color:#a78bfa;" onclick="startStage(2)">🔥 Stage 2：応用の問題に挑む</button>
    </div>
  </div>

  <div id="sGame" class="screen hidden">
    <div id="status-bar">
      <div class="stat-row">
        <span class="stat-label" id="st-title">Lv1 見習い魔導師</span>
        <span class="stat-label">Score: <span id="st-score">0</span></span>
      </div>
      <div class="stat-row">
        <span class="stat-label" style="width: 30px;">HP</span>
        <div class="bar-bg"><div id="hp-bar" class="hp-fill" style="width: 100%;"></div></div>
        <span class="stat-label" id="st-hp" style="width: 30px; text-align:right;">100</span>
      </div>
      <div class="stat-row">
        <span class="stat-label" style="width: 30px;">EXP</span>
        <div class="bar-bg"><div id="exp-bar" class="exp-fill" style="width: 0%;"></div></div>
        <span class="stat-label" id="st-exp" style="width: 30px; text-align:right;">0</span>
      </div>
    </div>

    <div id="progress-dots"></div>

    <div id="qCard" class="q-card">
      <div id="qHeader" class="q-header">Q 1 / 10 (第1周)</div>
      <div id="qText"></div>
      
      <div id="cBox" class="c-grid"></div>

      <div id="exBox" class="hidden"></div>
      
      <button id="btnNext" class="btn-primary hidden" style="margin-top:20px;" onclick="nextQ()">次の問題へ ▶</button>
    </div>
  </div>

  <div id="sLvUp" class="screen hidden">
    <div class="lv-box">
      <div class="star-anim">✨👑✨</div>
      <h2 id="lut" style="color: #fbbf24;">LvUP!</h2>
      <p style="color: var(--text-sub); margin-bottom: 5px;">新たな称号</p>
      <h3 id="lub" style="font-size: 1.5rem; margin-top: 0;">-</h3>
      <p id="lusk" style="font-weight: bold; margin-top: 20px; color: #10b981;">-</p>
      <button class="btn-primary" style="margin-top: 30px;" onclick="dismissLv()">続ける</button>
    </div>
  </div>

  <div id="sResult" class="screen hidden">
    <div class="floating-icon">🚩</div>
    <h2 id="res-title">セットクリア！</h2>
    <div class="res-stats" id="res-desc"></div>
    <button class="btn-primary" id="res-btn" onclick="onResult()"></button>
  </div>

</div>

<script>
// --- 問題データ作成 ---
const AQ = [
  { q: '2次方程式 \\( x^2-4x+2=0 \\) の2つの解を \\( \\alpha, \\beta \\) とするとき、 \\( \\alpha+\\beta \\) の値は？', c: ['4', '2', '-4', '-2'], ex: '解と係数の関係より、\\( \\alpha+\\beta = -\\frac{-4}{1} = 4 \\) です。' },
  { q: '2次方程式 \\( x^2-4x+2=0 \\) の2つの解を \\( \\alpha, \\beta \\) とするとき、 \\( \\alpha\\beta \\) の値は？', c: ['2', '4', '-2', '-4'], ex: '解と係数の関係より、\\( \\alpha\\beta = \\frac{2}{1} = 2 \\) です。' },
  { q: '2次方程式 \\( x^2-4x+2=0 \\) の解を \\( \\alpha, \\beta \\) とするとき、 \\( \\alpha^2\\beta + \\alpha\\beta^2 \\) の値は？', c: ['8', '6', '4', '10'], ex: '\\( \\alpha^2\\beta + \\alpha\\beta^2 = \\alpha\\beta(\\alpha+\\beta) \\) とくくります。解と係数の関係より \\( \\alpha+\\beta=4, \\alpha\\beta=2 \\) なので、\\( 2 \\times 4 = 8 \\) となります。' },
  { q: '2次方程式 \\( x^2-4x+2=0 \\) の解を \\( \\alpha, \\beta \\) とするとき、 \\( \\frac{\\alpha}{\\beta} + \\frac{\\beta}{\\alpha} \\) の値は？', c: ['6', '8', '4', '2'], ex: '通分すると \\( \\frac{\\alpha^2+\\beta^2}{\\alpha\\beta} = \\frac{(\\alpha+\\beta)^2 - 2\\alpha\\beta}{\\alpha\\beta} \\) となります。値を代入し、\\( \\frac{4^2 - 2 \\times 2}{2} = \\frac{16-4}{2} = 6 \\) です。' },
  { q: '多項式 \\( P(x)=x^3-3x+2 \\) について、 \\( P(0) \\) の値は？', c: ['2', '-2', '0', '1'], ex: '\\( x=0 \\) を代入すると、\\( P(0) = 0^3 - 3(0) + 2 = 2 \\) となります。' },
  { q: '多項式 \\( P(x)=x^3-3x+2 \\) について、 \\( P(2) \\) の値は？', c: ['4', '2', '8', '-4'], ex: '\\( x=2 \\) を代入すると、\\( P(2) = 2^3 - 3(2) + 2 = 8 - 6 + 2 = 4 \\) となります。' },
  { q: '多項式 \\( P(x)=x^3+x^2+3x-7 \\) を \\( x-2 \\) で割った余りは？', c: ['11', '-7', '5', '-11'], ex: '剰余の定理より、\\( P(2) \\) を求めます。\\( P(2) = 2^3 + 2^2 + 3(2) - 7 = 8 + 4 + 6 - 7 = 11 \\) です。' },
  { q: '多項式 \\( P(x)=x^3+x^2+3x-7 \\) を \\( x+3 \\) で割った余りは？', c: '-34', 'c': ['-34', '-7', '20', '34'], ex: '剰余の定理より、\\( P(-3) \\) を求めます。\\( P(-3) = (-3)^3 + (-3)^2 + 3(-3) - 7 = -27 + 9 - 9 - 7 = -34 \\) です。' },
  { q: '方程式 \\( x^3-64=0 \\) の解は？', c: ['\\( x=4, -2\\pm2\\sqrt{3}i \\)', '\\( x=4, \\pm 4i \\)', '\\( x=-4, 2\\pm2\\sqrt{3}i \\)', '\\( x=4, \\pm 2\\sqrt{3}i \\)'], ex: '因数分解すると \\( (x-4)(x^2+4x+16)=0 \\)。よって \\( x=4 \\) と、\\( x^2+4x+16=0 \\) より \\( x = \\frac{-4 \\pm \\sqrt{16-64}}{2} = -2 \\pm 2\\sqrt{3}i \\) です。' },
  { q: '方程式 \\( x^4-9=0 \\) の解は？', c: ['\\( x=\\pm\\sqrt{3}, \\pm\\sqrt{3}i \\)', '\\( x=\\pm 3, \\pm 3i \\)', '\\( x=\\pm\\sqrt{3}, \\pm 3i \\)', '\\( x=3, -3i \\)'], ex: '\\( (x^2-3)(x^2+3)=0 \\) と因数分解できます。\\( x^2=3 \\) から \\( x=\\pm\\sqrt{3} \\)、\\( x^2=-3 \\) から \\( x=\\pm\\sqrt{3}i \\) を得ます。' },
  { q: '方程式 \\( x^4+7x^2-18=0 \\) の解は？', c: ['\\( x=\\pm\\sqrt{2}, \\pm 3i \\)', '\\( x=\\pm 2, \\pm\\sqrt{3}i \\)', '\\( x=\\pm 3, \\pm\\sqrt{2}i \\)', '\\( x=\\pm\\sqrt{2}, \\pm 9i \\)'], ex: '\\( (x^2+9)(x^2-2)=0 \\) と因数分解できます。よって \\( x^2=-9 \\) から \\( x=\\pm 3i \\)、\\( x^2=2 \\) から \\( x=\\pm\\sqrt{2} \\) となります。' },
  { q: '数直線上の2点 \\( A(2), B(6) \\) 間の距離は？', c: ['4', '8', '3', '12'], ex: '数直線上の距離は \\( |6 - 2| = 4 \\) です。' },
  { q: '数直線上の2点 \\( A(4), B(-3) \\) 間の距離は？', c: ['7', '1', '-1', '12'], ex: '数直線上の距離は \\( |4 - (-3)| = 7 \\) です。' },
  { q: '座標平面上の2点 \\( A(-1,3), B(5,9) \\) 間の距離は？', c: ['\\( 6\\sqrt{2} \\)', '\\( 8\\sqrt{2} \\)', '6', '12'], ex: '距離の公式より、\\( \\sqrt{(5 - (-1))^2 + (9 - 3)^2} = \\sqrt{36 + 36} = \\sqrt{72} = 6\\sqrt{2} \\) です。' },
  { q: '2点 \\( A(-1,3), B(5,9) \\) を 2:1 に内分する点の座標は？', c: ['\\( (3,7) \\)', '\\( (2,6) \\)', '\\( (1,5) \\)', '\\( (4,8) \\)'], ex: '内分点の公式より、\\( x = \\frac{1\\times(-1) + 2\\times5}{2+1} = \\frac{9}{3} = 3 \\), \\( y = \\frac{1\\times3 + 2\\times9}{2+1} = \\frac{21}{3} = 7 \\) となります。' },
  { q: '2点 \\( A(-1,3), B(5,9) \\) を 3:2 に外分する点の座標は？', c: ['\\( (17,21) \\)', '\\( (11,15) \\)', '\\( (7,15) \\)', '\\( (13,19) \\)'], ex: '外分点の公式より、\\( x = \\frac{-2\\times(-1) + 3\\times5}{3-2} = 17 \\), \\( y = \\frac{-2\\times3 + 3\\times9}{3-2} = 21 \\) となります。' },
  { q: '2点 \\( A(-1,3), B(5,9) \\) の中点の座標は？', c: ['\\( (2,6) \\)', '\\( (3,7) \\)', '\\( (1,5) \\)', '\\( (4,8) \\)'], ex: '中点座標は各成分の平均なので、\\( x = \\frac{-1+5}{2} = 2 \\), \\( y = \\frac{3+9}{2} = 6 \\) となります。' },
  { q: '3点 \\( A(2,1), B(6,0), C(-2,5) \\) を頂点とする三角形の重心の座標は？', c: ['\\( (2,2) \\)', '\\( (3,2) \\)', '\\( (2,3) \\)', '\\( (6,6) \\)'], ex: '重心の座標は各成分の平均なので、\\( x = \\frac{2+6-2}{3} = 2 \\), \\( y = \\frac{1+0+5}{3} = 2 \\) となります。' },
  { q: '点 \\( (4,5) \\) を通り、傾きが -3 の直線の方程式は？', c: ['\\( y=-3x+17 \\)', '\\( y=-3x+7 \\)', '\\( y=3x-7 \\)', '\\( y=-3x-7 \\)'], ex: '公式 \\( y - y_1 = m(x - x_1) \\) より、\\( y - 5 = -3(x - 4) \\) 展開して \\( y = -3x + 17 \\) となります。' },
  { q: '点 \\( (-1,2) \\) を通り、直線 \\( y=4x-1 \\) に平行な直線の方程式は？', c: ['\\( y=4x+6 \\)', '\\( y=4x+2 \\)', '\\( y=4x+3 \\)', '\\( y=-4x-2 \\)'], ex: '平行な直線の傾きは同じ 4 です。\\( y - 2 = 4(x - (-1)) \\) より、\\( y = 4x + 6 \\) となります。' },
  { q: '点 \\( (6,-4) \\) を通り、直線 \\( y=3x+5 \\) に垂直な直線の方程式は？', c: ['\\( y=-\\frac{1}{3}x-2 \\)', '\\( y=\\frac{1}{3}x-6 \\)', '\\( y=-3x+14 \\)', '\\( y=3x-22 \\)'], ex: '垂直な直線の傾き \\( m \\) は \\( 3 \\times m = -1 \\) より \\( m = -\\frac{1}{3} \\)。よって \\( y - (-4) = -\\frac{1}{3}(x - 6) \\) から \\( y = -\\frac{1}{3}x - 2 \\) です。' },
  { q: '点 \\( (2,3) \\) と直線 \\( x-2y-1=0 \\) との距離は？', c: ['\\( \\sqrt{5} \\)', '\\( 5 \\)', '\\( \\frac{\\sqrt{5}}{5} \\)', '\\( 2\\sqrt{5} \\)'], ex: '点と直線の距離の公式より、\\( d = \\frac{|1\\times2 - 2\\times3 - 1|}{\\sqrt{1^2 + (-2)^2}} = \\frac{|-5|}{\\sqrt{5}} = \\sqrt{5} \\) です。' },
  { q: '中心が \\( (1,3) \\) で半径が 4 の円の方程式は？', c: ['\\( (x-1)^2+(y-3)^2=16 \\)', '\\( (x+1)^2+(y+3)^2=16 \\)', '\\( (x-1)^2+(y-3)^2=4 \\)', '\\( (x-1)^2+(y-3)^2=8 \\)'], ex: '円の方程式 \\( (x-a)^2 + (y-b)^2 = r^2 \\) に代入し、\\( (x-1)^2+(y-3)^2 = 4^2 = 16 \\) となります。' },
  { q: '円 \\( (x+3)^2+(y-4)^2=8 \\) の中心の座標と半径は？', c: ['中心 \\( (-3,4) \\), 半径 \\( 2\\sqrt{2} \\)', '中心 \\( (3,-4) \\), 半径 8', '中心 \\( (-3,4) \\), 半径 4', '中心 \\( (3,-4) \\), 半径 \\( 2\\sqrt{2} \\)'], ex: '\\( a=-3, b=4, r^2=8 \\) なので、中心は \\( (-3,4) \\)、半径は \\( \\sqrt{8} = 2\\sqrt{2} \\) です。' },
  { q: '2点 \\( A(1,1), B(7,9) \\) を結ぶ線分を直径とする円の方程式は？', c: ['\\( (x-4)^2+(y-5)^2=25 \\)', '\\( (x-3)^2+(y-4)^2=25 \\)', '\\( (x-4)^2+(y-5)^2=5 \\)', '\\( (x-8)^2+(y-10)^2=100 \\)'], ex: '中心は線分の中点で \\( (\\frac{1+7}{2}, \\frac{1+9}{2}) = (4,5) \\)。半径は中心とAの距離で \\( \\sqrt{(4-1)^2+(5-1)^2} = \\sqrt{9+16} = 5 \\)。よって式は \\( (x-4)^2+(y-5)^2=25 \\)。' },
  { q: '円 \\( x^2+y^2+2x-6y+6=0 \\) の中心の座標と半径は？', c: ['中心 \\( (-1,3) \\), 半径 2', '中心 \\( (1,-3) \\), 半径 4', '中心 \\( (-1,3) \\), 半径 \\( \\sqrt{6} \\)', '中心 \\( (2,-6) \\), 半径 6'], ex: '平方完成します。\\( (x^2+2x+1)-1 + (y^2-6y+9)-9 + 6 = 0 \\) より、\\( (x+1)^2 + (y-3)^2 = 4 \\)。中心 \\( (-1,3) \\), 半径 \\( \\sqrt{4}=2 \\) です。' },

  // --- 問７：式の番号を選ぶ（type:'choice3'） ---
  {

// --- システム関数 ---
const SCREENS = ['sTitle','sGame','sLvUp','sResult'];
function showScreen(id) {
  SCREENS.forEach(x => {
    const el = document.getElementById(x);
    if (x === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
}

function mjTypeset(el) {
  function run() {
    if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
      MathJax.typesetClear([el]);
      MathJax.typesetPromise([el]).catch(() => {});
    } else {
      setTimeout(run, 80);
    }
  }
  run();
}

function fy(a) {
  const r = [...a];
  for (let i = r.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

// Stage1: 基礎問題
// 1(1)(2)=[0,1]  2(1)(2)=[4,5]  3(1)(2)=[6,7]  5(1)(2)=[11,12]
// 6(1-4)=[29-32]  7(1-3)=[26-28]
// 8(4)=[16]  9=[17]
// 13(1)(2)=[22,33]  14(1)(2)=[23,34]
const STAGE1_IDX = [0,1,4,5,6,7,11,12,16,17,22,23,26,27,28,29,30,31,32,33,34];

// Stage2: 応用問題
// 1(3)(4)=[2,3]  4(1-4)=[8,9,10,35]  8(1)(2)(3)=[13,14,15]  10平行垂直=[36,37]
// 11(1)(2)(3)(4)=[18,38,19,20]  12=[21]  15(1)(2)=[24,39]  16=[25]  17=[40]
const STAGE2_IDX = [2,3,8,9,10,13,14,15,35,36,37,18,38,19,20,21,24,39,25,40];

let currentStage = 1;

function buildSets(stageIdx) {
  const base = fy([...stageIdx]);
  const n = base.length;
  return [
    base.slice(0, Math.ceil(n/3)),
    base.slice(Math.ceil(n/3), Math.ceil(n/3)*2),
    base.slice(Math.ceil(n/3)*2)
  ];
}

function startStage(stage) {
  currentStage = stage;
  SI = 0;
  sets = buildSets(stage === 1 ? STAGE1_IDX : STAGE2_IDX);
  showScreen('sGame');
  newGame();
}

function createPopup(text, type) {
  const pop = document.createElement('div');
  pop.className = 'popup ' + (type === 'exp' ? 'pop-exp' : 'pop-hp');
  pop.textContent = text;
  
  // 中央付近にランダム表示
  const appRect = document.getElementById('app').getBoundingClientRect();
  const left = appRect.width / 2 + (Math.random() * 60 - 30);
  const top = appRect.height / 2 + (Math.random() * 40 - 20) - 100;
  
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  
  document.getElementById('app').appendChild(pop);
  setTimeout(() => pop.remove(), 1000);
}

// --- ゲーム状態 ---
let SI = 0, sets = [], total = 0, qs = [], cur = 0;
let hp = 100, exp = 0, sc = 0, clv = 1;
let history = [];

function updateStatus() {
  let hpColor = '#10b981';
  if (hp <= 50) hpColor = '#fbbf24';
  if (hp <= 20) hpColor = '#ef4444';
  
  document.getElementById('hp-bar').style.width = Math.max(0, hp) + '%';
  document.getElementById('hp-bar').style.backgroundColor = hpColor;
  document.getElementById('st-hp').textContent = Math.max(0, hp);
  
  document.getElementById('st-score').textContent = sc;
  
  // レベル計算
  let nl = 1;
  for (let i = 0; i < LVS.length; i++) {
    if (exp >= LVS[i].exp) nl = LVS[i].lv;
  }
  
  // 経験値バー計算
  const currentL = LVS[nl-1];
  const nextL = LVS[nl] || currentL;
  let pct = 100;
  if (nextL.lv > nl) {
    pct = ((exp - currentL.exp) / (nextL.exp - currentL.exp)) * 100;
  }
  document.getElementById('exp-bar').style.width = pct + '%';
  document.getElementById('st-exp').textContent = exp;
  document.getElementById('st-title').textContent = `Lv${nl} ${currentL.n}`;
  
  return nl;
}

function renderDots() {
  const c = document.getElementById('progress-dots');
  c.innerHTML = '';
  for(let i=0; i<total; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    if (i < cur) {
      d.classList.add(history[i] ? 'ok' : 'ng');
    } else if (i === cur) {
      d.classList.add('current');
    }
    c.appendChild(d);
  }
}

function newGame() {
  hp = 100; exp = 0; sc = 0; clv = 1; history = [];
  const idx = sets[SI];
  total = idx.length;
  
  qs = idx.map(i => {
    const q = AQ[i];
    if (q.type === 'choice3' || q.type === 'number') {
      return { ...q };
    }
    // 通常4択 & choice4label：選択肢をシャッフル
    return {
      ...q,
      sh: fy([...Array(q.c.length).keys()]).map(k => ({ t: q.c[k], o: k }))
    };
  });
  
  cur = 0;
  updateStatus();
  showQ();
}

function showQ() {
  const q = qs[cur];
  document.getElementById('qHeader').textContent = `【Stage${currentStage}】Q ${cur+1} / ${total} （第${SI+1}周）`;
  
  const qEl = document.getElementById('qText');
  // 改行コードを<br>に変換して表示
  qEl.innerHTML = '';
  q.q.split('\n').forEach((line, i) => {
    if (i > 0) qEl.appendChild(document.createElement('br'));
    qEl.appendChild(document.createTextNode(line));
  });
  mjTypeset(qEl);
  
  const cb = document.getElementById('cBox');
  cb.innerHTML = '';
  
  if (q.type === 'choice3') {
    // 公式を番号ボタンで選ぶ
    renderChoice3(q, cb);
  } else if (q.type === 'number') {
    // 数直線SVG＋数値入力
    renderNumberInput(q, cb);
  } else {
    // 通常4択 & choice4label（選択肢にMathJaxを含む場合はinnerHTMLを使う）
    const labels = ['ア','イ','ウ','エ'];
    q.sh.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'c-btn';
      btn.innerHTML = `<div class="c-badge">${labels[i]}</div><div class="c-text"></div>`;
      if (q.type === 'choice4label') {
        btn.querySelector('.c-text').innerHTML = choice.t;
      } else {
        btn.querySelector('.c-text').textContent = choice.t;
      }
      btn.onclick = () => ans4(i, choice.o);
      cb.appendChild(btn);
    });
  }
  
  mjTypeset(cb);
  
  document.getElementById('exBox').className = 'hidden';
  document.getElementById('btnNext').classList.add('hidden');
  renderDots();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderChoice3(q, cb) {
  // 選択肢の公式ボックスを表示
  const box = document.createElement('div');
  box.style.cssText = 'background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;margin-bottom:14px;font-size:0.95rem;line-height:2.0;';
  q.formulas.forEach((f, i) => {
    const row = document.createElement('div');
    row.innerHTML = `<span style="color:#fbbf24;font-weight:bold;">① ②③`.replace(/[①②③]/g, m => ['①','②','③'][i]) + `</span> `;
    row.innerHTML = '';
    const num = document.createElement('span');
    num.style.cssText = 'color:#fbbf24;font-weight:bold;margin-right:8px;';
    num.textContent = ['①','②','③'][i];
    const formula = document.createElement('span');
    formula.textContent = f;
    row.appendChild(num);
    row.appendChild(formula);
    box.appendChild(row);
  });
  cb.appendChild(box);
  mjTypeset(box);

  // 番号ボタン
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:12px;justify-content:center;margin-top:4px;';
  ['①','②','③'].forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'c-btn';
    btn.style.cssText = 'justify-content:center;font-size:1.3rem;width:72px;height:56px;';
    btn.textContent = label;
    btn.onclick = () => ansChoice3(String(i+1), q, btn, btnRow);
    btnRow.appendChild(btn);
  });
  cb.appendChild(btnRow);
}

function ansChoice3(chosen, q, clickedBtn, btnRow) {
  const btns = btnRow.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  
  const isOk = (chosen === q.ans);
  history[cur] = isOk;
  
  // 正解番号のボタンを特定
  const correctIdx = parseInt(q.ans) - 1;
  btns[correctIdx].classList.add('correct');
  if (!isOk) clickedBtn.classList.add('wrong');
  
  if (isOk) {
    exp += 40; sc += 100;
    createPopup('+40 EXP', 'exp');
  } else {
    hp -= 10;
    createPopup('-10 HP', 'hp');
    const card = document.getElementById('qCard');
    card.classList.add('flash-anim');
    setTimeout(() => card.classList.remove('flash-anim'), 500);
  }
  
  showExBox(isOk, q.ex);
}

  svg.setAttribute('viewBox', '0 0 560 70');
  svg.setAttribute('width', '100%');
  svg.style.marginBottom = '12px';

  const minN = 1, maxN = 27;
  const svgW = 560, left = 20, right = 540;
  const y = 38;
  const toX = n => left + (n - minN) / (maxN - minN) * (right - left);

  // 軸線
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', left); line.setAttribute('y1', y);

  line.setAttribute('stroke', '#94a3b8'); line.setAttribute('stroke-width', '2');

  // 目盛りと番号
  for (let n = minN; n <= maxN; n++) {

    tick.setAttribute('x2', x); tick.setAttribute('y2', y+5);

    svg.appendChild(tick);
    if (n % 2 === 1 || n === maxN) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', x); txt.setAttribute('y', y+18);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-size', '8');
      txt.setAttribute('fill', '#94a3b8');
      txt.textContent = n;
      svg.appendChild(txt);
    }
  }

  // AとBのマーカー
  [['A', 10, '#10b981'], ['B', 16, '#f59e0b']].forEach(([label, val, color]) => {
    const x = toX(val);
    const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circ.setAttribute('cx', x); circ.setAttribute('cy', y); circ.setAttribute('r', '6');
    circ.setAttribute('fill', color);
    svg.appendChild(circ);
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', x); txt.setAttribute('y', y-10);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', '13');
    txt.setAttribute('font-weight', 'bold');
    txt.setAttribute('fill', color);
    txt.textContent = label;
    svg.appendChild(txt);
  });

  cb.appendChild(svg);

  // 入力フォーム
  const inputArea = document.createElement('div');
  inputArea.style.cssText = 'display:flex;gap:10px;align-items:center;justify-content:center;margin-top:4px;';

  const inp = document.createElement('input');
  inp.type = 'number';
  inp.placeholder = '番号を入力';
  inp.style.cssText = 'width:120px;padding:10px;font-size:1.1rem;border-radius:8px;border:2px solid #334155;background:#0f172a;color:#f8fafc;text-align:center;';

  const submitBtn = document.createElement('button');
  submitBtn.className = 'c-btn';
  submitBtn.style.cssText = 'width:auto;padding:10px 20px;justify-content:center;font-size:1rem;';
  submitBtn.textContent = '答える ▶';
  submitBtn.onclick = () => {
    const val = inp.value.trim();
    if (val === '') return;
    inp.disabled = true;
    submitBtn.disabled = true;
    ansNumber(val, q, inp, submitBtn);
  };

  // Enterキーでも送信
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitBtn.click();
  });

  inputArea.appendChild(inp);
  inputArea.appendChild(submitBtn);
  cb.appendChild(inputArea);
  
  // フォーカス
  setTimeout(() => inp.focus(), 200);
}

function ansNumber(inputVal, q, inp, submitBtn) {
  const isOk = (inputVal === q.ans);
  history[cur] = isOk;

  // 正誤の色フィードバック
  inp.style.borderColor = isOk ? '#10b981' : '#ef4444';
  inp.style.backgroundColor = isOk ? 'rgba(6,78,59,0.4)' : 'rgba(127,29,29,0.4)';

  if (isOk) {
    exp += 40; sc += 100;
    createPopup('+40 EXP', 'exp');
  } else {
    // 正解を表示
    const ans = document.createElement('div');
    ans.style.cssText = 'color:#10b981;font-weight:bold;font-size:1rem;margin-top:6px;text-align:center;';
    ans.textContent = `正解は ${q.ans}`;
    inp.parentElement.parentElement.appendChild(ans);
    hp -= 10;
    createPopup('-10 HP', 'hp');
    const card = document.getElementById('qCard');
    card.classList.add('flash-anim');
    setTimeout(() => card.classList.remove('flash-anim'), 500);
  }

  showExBox(isOk, q.ex);
}

function showExBox(isOk, exText) {
  const newLv = updateStatus();
  const exBox = document.getElementById('exBox');
  exBox.className = isOk ? 'ex-ok' : 'ex-ng';
  exBox.textContent = (isOk ? '【正解！】 ' : '【不正解…】 ') + exText;
  mjTypeset(exBox);
  document.getElementById('btnNext').classList.remove('hidden');
  renderDots();

  if (hp <= 0) {
    setTimeout(() => {
      alert('HPが尽きてしまった…！\n最初からやり直そう。');
      startStage(currentStage);
    }, 1000);
    return;
  }
  if (newLv > clv) {
    clv = newLv;
    setTimeout(() => showLvUp(LVS[clv-1]), 800);
  }
}

function ans4(idx, origIdx) {
  const btns = document.querySelectorAll('.c-btn');
  btns.forEach(b => b.disabled = true);
  
  const isOk = (origIdx === 0);
  history[cur] = isOk;
  
  if (isOk) {
    btns[idx].classList.add('correct');
    exp += 40; sc += 100;
    createPopup('+40 EXP', 'exp');
  } else {
    btns[idx].classList.add('wrong');
    const correctIdx = qs[cur].sh.findIndex(x => x.o === 0);
    btns[correctIdx].classList.add('correct');
    hp -= 10;
    createPopup('-10 HP', 'hp');
    const card = document.getElementById('qCard');
    card.classList.add('flash-anim');
    setTimeout(() => card.classList.remove('flash-anim'), 500);
  }
  
  showExBox(isOk, qs[cur].ex);
}

function showLvUp(ld) {
  document.getElementById('lut').textContent = 'Lv' + ld.lv + ' に昇格！';
  document.getElementById('lub').textContent = ld.n;
  document.getElementById('lusk').textContent = '新スキル：「' + ld.s + '」を習得！';
  showScreen('sLvUp');
}

function dismissLv() {
  showScreen('sGame');
}

function nextQ() {
  cur++;
  if (cur >= total) {
    showResult();
    return;
  }
  showQ();
}

function showResult() {
  const okCnt = history.filter(x => x).length;
  const stageName = currentStage === 1 ? 'Stage 1（基礎）' : 'Stage 2（応用）';
  document.getElementById('res-desc').innerHTML = `
    ${stageName} 第${SI+1}周 クリア！<br>
    正答数：${okCnt} / ${total} 問<br>
    スコア：${sc}
  `;
  
  const btn = document.getElementById('res-btn');
  if (SI === 0) {
    btn.textContent = '第2周へ進む（残り2周）▶';
  } else if (SI === 1) {
    btn.textContent = '第3周へ進む（残り1周）▶';
  } else {
    document.getElementById('res-title').textContent = `${stageName} 全3周コンプリート！`;
    document.getElementById('res-desc').innerHTML += '<br><br><span style="color:#10b981;">全問に触れました！素晴らしい！</span>';
    btn.textContent = 'ステージ選択に戻る 🏠';
  }
  
  showScreen('sResult');
}

function onResult() {
  if (SI < 2) {
    SI++;
    showScreen('sGame');
    newGame();
  } else {
    showScreen('sTitle');
  }
}
</script>

</body>
</html>
