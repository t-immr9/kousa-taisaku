const DATA=[{"name":"円と直線の共有点","qs":[{"q":"x²+y²=1，y=2x+1 の共有点を求めよ。","labels":["共有点1","共有点2"],"a":["(0,1)","(-4/5,-3/5)"],"e":"<b>① 直線を円に代入する</b><br>x²+(2x+1)²=1<br>5x²+4x=0<br>x(5x+4)=0<br>よって、x=0，−4/5。<br><b>② それぞれのxを y=2x+1 に代入する</b><br>x=0 のとき y=1、x=−4/5 のとき y=−3/5。<br>したがって、共有点は <b>(0,1)，(−4/5,−3/5)</b>。","u":true},{"q":"x²+y²=10，y=3x−10 の共有点を求めよ。","labels":["共有点"],"a":["(3,-1)"],"e":"<b>① 直線を円に代入する</b><br>x²+(3x−10)²=10<br>10x²−60x+90=0<br>10(x−3)²=0<br>よって、x=3。<br><b>② x=3を y=3x−10 に代入する</b><br>y=−1。<br>二次方程式が重解をもつので共有点は1つで、<b>(3,−1)</b>。","u":false},{"q":"x²+y²=25，y=−x+5 の共有点を求めよ。","labels":["共有点1","共有点2"],"a":["(0,5)","(5,0)"],"e":"<b>① 直線を円に代入する</b><br>x²+(−x+5)²=25<br>2x²−10x=0<br>2x(x−5)=0<br>よって、x=0，5。<br><b>② y=−x+5 に代入する</b><br>x=0 のとき y=5、x=5 のとき y=0。<br>したがって、共有点は <b>(0,5)，(5,0)</b>。","u":true},{"q":"x²+y²=10，y=x+2 の共有点を求めよ。","labels":["共有点1","共有点2"],"a":["(-3,-1)","(1,3)"],"e":"<b>① 直線を円に代入する</b><br>x²+(x+2)²=10<br>2x²+4x−6=0<br>2(x+3)(x−1)=0<br>よって、x=−3，1。<br><b>② y=x+2 に代入する</b><br>x=−3 のとき y=−1、x=1 のとき y=3。<br>したがって、共有点は <b>(−3,−1)，(1,3)</b>。","u":true},{"q":"x²+y²=4，y=2x−4 の共有点を求めよ。","labels":["共有点1","共有点2"],"a":["(6/5,-8/5)","(2,0)"],"e":"<b>① 直線を円に代入する</b><br>x²+(2x−4)²=4<br>5x²−16x+12=0<br>(5x−6)(x−2)=0<br>よって、x=6/5，2。<br><b>② y=2x−4 に代入する</b><br>x=6/5 のとき y=−8/5、x=2 のとき y=0。<br>したがって、共有点は <b>(6/5,−8/5)，(2,0)</b>。","u":true}]},{"name":"円に接する直線の条件","qs":[{"q":"円 x²+y²=2 と直線 y=x+m が接するとき、mの値を求めよ。","labels":["m="],"a":["±2"],"e":"<b>【方法1】直線を円に代入し、判別式 D=0 を使う</b><br>y=x+m を x²+y²=2 に代入すると、<br>x²+(x+m)²=2<br>2x²+2mx+m²−2=0<br>直線と円が接するとき、この二次方程式は重解をもつので、<br>D=(2m)²−4・2・(m²−2)=0<br>4m²−8m²+16=0<br>m²=4<br>よって、<b>m=±2</b>。<br><br><b>【方法2】点と直線の距離の公式を使う</b><br>y=x+m を x−y+m=0 と変形する。<br>円の中心 O(0,0) から直線までの距離は、<br><span class=\"formula-line\"><span class=\"frac-view\"><span>|0−0+m|</span><i></i><span>√(1²+(−1)²)</span></span>=<span class=\"frac-view\"><span>|m|</span><i></i><span>√2</span></span></span><br>接するとき、この距離は半径 √2 に等しいので、<br><span class=\"frac-view\"><span>|m|</span><i></i><span>√2</span></span>=√2<br>|m|=2<br>よって、<b>m=±2</b>。","u":false},{"q":"円 x²+y²=1 と直線 y=x+m が接するとき、mの値を求めよ。","labels":["m="],"a":["±√2"],"e":"<b>【方法1】直線を円に代入し、判別式 D=0 を使う</b><br>y=x+m を x²+y²=1 に代入すると、<br>x²+(x+m)²=1<br>2x²+2mx+m²−1=0<br>直線と円が接するとき、この二次方程式は重解をもつので、<br>D=(2m)²−4・2・(m²−1)=0<br>4m²−8m²+8=0<br>m²=2<br>よって、<b>m=±√2</b>。<br><br><b>【方法2】点と直線の距離の公式を使う</b><br>y=x+m を x−y+m=0 と変形する。<br>円の中心 O(0,0) から直線までの距離は、<br><span class=\"frac-view\"><span>|m|</span><i></i><span>√2</span></span><br>接するとき、この距離は半径1に等しいので、<br><span class=\"frac-view\"><span>|m|</span><i></i><span>√2</span></span>=1<br>|m|=√2<br>よって、<b>m=±√2</b>。","u":false},{"q":"円 x²+y²=5 と直線 y=−2x+m が接するとき、mの値を求めよ。","labels":["m="],"a":["±5"],"e":"<b>【方法1】直線を円に代入し、判別式 D=0 を使う</b><br>y=−2x+m を x²+y²=5 に代入すると、<br>x²+(−2x+m)²=5<br>5x²−4mx+m²−5=0<br>直線と円が接するとき、この二次方程式は重解をもつので、<br>D=(−4m)²−4・5・(m²−5)=0<br>16m²−20m²+100=0<br>m²=25<br>よって、<b>m=±5</b>。<br><br><b>【方法2】点と直線の距離の公式を使う</b><br>y=−2x+m を 2x+y−m=0 と変形する。<br>円の中心 O(0,0) から直線までの距離は、<br><span class=\"formula-line\"><span class=\"frac-view\"><span>|−m|</span><i></i><span>√(2²+1²)</span></span>=<span class=\"frac-view\"><span>|m|</span><i></i><span>√5</span></span></span><br>接するとき、この距離は半径 √5 に等しいので、<br><span class=\"frac-view\"><span>|m|</span><i></i><span>√5</span></span>=√5<br>|m|=5<br>よって、<b>m=±5</b>。","u":false}]},{"name":"円と直線が接するときの半径","qs":[{"q":"円 x²+y²=r² と直線 3x+4y−5=0 が接するとき、rを求めよ。","labels":["r="],"a":["1"],"e":"<b>点と直線の距離の公式を使う</b><br>円 x²+y²=r² の中心は <b>O(0,0)</b>、半径は <b>r</b> である。<br>円と直線が接するとき、中心 O から直線までの距離が半径 r に等しい。<br><br>点 (x₁,y₁) と直線 ax+by+c=0 の距離は、<br><span class=\"frac-view\"><span>|ax₁+by₁+c|</span><i></i><span>√(a²+b²)</span></span><br><br>直線 3x+4y−5=0 に、中心 O(0,0) を代入すると、<br><span class=\"formula-line\">r=<span class=\"frac-view\"><span>|3・0+4・0−5|</span><i></i><span>√(3²+4²)</span></span></span><br><span class=\"formula-line\">=<span class=\"frac-view\"><span>|−5|</span><i></i><span>√(9+16)</span></span></span><br><span class=\"formula-line\">=<span class=\"frac-view\"><span>5</span><i></i><span>5</span></span>=1</span><br>よって、<b>r=1</b>。","u":false},{"q":"円 x²+y²=r² と直線 4x+y+17=0 が接するとき、rを求めよ。","labels":["r="],"a":["√17"],"e":"<b>点と直線の距離の公式を使う</b><br>円 x²+y²=r² の中心は <b>O(0,0)</b>、半径は <b>r</b> である。<br>円と直線が接するとき、中心 O から直線までの距離が半径 r に等しい。<br><br>点 (x₁,y₁) と直線 ax+by+c=0 の距離は、<br><span class=\"frac-view\"><span>|ax₁+by₁+c|</span><i></i><span>√(a²+b²)</span></span><br><br>直線 4x+y+17=0 に、中心 O(0,0) を代入すると、<br><span class=\"formula-line\">r=<span class=\"frac-view\"><span>|4・0+1・0+17|</span><i></i><span>√(4²+1²)</span></span></span><br><span class=\"formula-line\">=<span class=\"frac-view\"><span>17</span><i></i><span>√17</span></span></span><br><span class=\"formula-line\">=<span class=\"frac-view\"><span>17√17</span><i></i><span>17</span></span>=√17</span><br>よって、<b>r=√17</b>。","u":false},{"q":"円 x²+y²=r² と直線 3x+y−10=0 が接するとき、rを求めよ。","labels":["r="],"a":["√10"],"e":"<b>点と直線の距離の公式を使う</b><br>円 x²+y²=r² の中心は <b>O(0,0)</b>、半径は <b>r</b> である。<br>円と直線が接するとき、中心 O から直線までの距離が半径 r に等しい。<br><br>点 (x₁,y₁) と直線 ax+by+c=0 の距離は、<br><span class=\"frac-view\"><span>|ax₁+by₁+c|</span><i></i><span>√(a²+b²)</span></span><br><br>直線 3x+y−10=0 に、中心 O(0,0) を代入すると、<br><span class=\"formula-line\">r=<span class=\"frac-view\"><span>|3・0+1・0−10|</span><i></i><span>√(3²+1²)</span></span></span><br><span class=\"formula-line\">=<span class=\"frac-view\"><span>10</span><i></i><span>√10</span></span></span><br><span class=\"formula-line\">=<span class=\"frac-view\"><span>10√10</span><i></i><span>10</span></span>=√10</span><br>よって、<b>r=√10</b>。","u":false}]},{"name":"円上の点における接線","qs":[{"q":"円 x²+y²=17 上の点 P(1,4) における接線の方程式を求めよ。","labels":["接線"],"a":["x+4y=17"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=1、y₁=4、r²=17 なので、<br>x・1+y・4=17<br>x+4y=17<br>よって、接線の方程式は <b>x+4y=17</b>。","u":false},{"q":"円 x²+y²=9 上の点 P(2√2,−1) における接線の方程式を求めよ。","labels":["接線"],"a":["2√2x-y=9"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=2√2、y₁=−1、r²=9 なので、<br>x・2√2+y・(−1)=9<br>2√2x−y=9<br>よって、接線の方程式は <b>2√2x−y=9</b>。","u":false},{"q":"円 x²+y²=25 上の点 P(4,3) における接線の方程式を求めよ。","labels":["接線"],"a":["4x+3y=25"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=4、y₁=3、r²=25 なので、<br>x・4+y・3=25<br>4x+3y=25<br>よって、接線の方程式は <b>4x+3y=25</b>。","u":false},{"q":"円 x²+y²=5 上の点 P(−1,2) における接線の方程式を求めよ。","labels":["接線"],"a":["-x+2y=5"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=−1、y₁=2、r²=5 なので、<br>x・(−1)+y・2=5<br>−x+2y=5<br>よって、接線の方程式は <b>−x+2y=5</b>。","u":false},{"q":"円 x²+y²=13 上の点 P(3,−2) における接線の方程式を求めよ。","labels":["接線"],"a":["3x-2y=13"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=3、y₁=−2、r²=13 なので、<br>x・3+y・(−2)=13<br>3x−2y=13<br>よって、接線の方程式は <b>3x−2y=13</b>。","u":false},{"q":"円 x²+y²=4 上の点 P(2,0) における接線の方程式を求めよ。","labels":["接線"],"a":["x=2"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=2、y₁=0、r²=4 なので、<br>x・2+y・0=4<br>2x=4<br>x=2<br>よって、接線の方程式は <b>x=2</b>。","u":false},{"q":"円 x²+y²=13 上の点 P(−2,3) における接線の方程式を求めよ。","labels":["接線"],"a":["-2x+3y=13"],"e":"<b>円上の点における接線の公式を使う</b><br>円 x²+y²=r² 上の点 (x₁,y₁) における接線は、<br><b>xx₁+yy₁=r²</b><br><br>この問題では、x₁=−2、y₁=3、r²=13 なので、<br>x・(−2)+y・3=13<br>−2x+3y=13<br>よって、接線の方程式は <b>−2x+3y=13</b>。","u":false}]},{"name":"1次不等式の表す領域","qs":[{"q":"不等式 y>−2x+4 の表す領域を答えよ。","labels":["領域"],"a":["直線の上側・境界を含まない"],"e":"yが直線より大きい側。","u":false},{"q":"不等式 2x+3y−12<0 の表す領域を答えよ。","labels":["領域"],"a":["直線の下側・境界を含まない"],"e":"y<−2x/3+4。","u":false},{"q":"不等式 y<−x の表す領域を答えよ。","labels":["領域"],"a":["直線の下側・境界を含まない"],"e":"境界は破線。","u":false},{"q":"不等式 y≧−2x+3 の表す領域を答えよ。","labels":["領域"],"a":["直線の上側・境界を含む"],"e":"≧なので境界を含む。","u":false},{"q":"不等式 y≦3x+6 の表す領域を答えよ。","labels":["領域"],"a":["直線の下側・境界を含む"],"e":"≦なので境界を含む。","u":false},{"q":"不等式 x+y>3 の表す領域を答えよ。","labels":["領域"],"a":["直線の上側・境界を含まない"],"e":"y>−x+3。","u":false},{"q":"不等式 2x−3y>6 の表す領域を答えよ。","labels":["領域"],"a":["直線の下側・境界を含まない"],"e":"変形すると y<2x/3−2。","u":false},{"q":"不等式 4x+3y−12≦0 の表す領域を答えよ。","labels":["領域"],"a":["直線の下側・境界を含む"],"e":"y≦−4x/3+4。","u":false}]},{"name":"円の不等式の表す領域","qs":[{"q":"不等式 x²+y²>4 の表す領域を答えよ。","labels":["領域"],"a":["円の外部・境界を含まない"],"e":"半径2の円の外部。","u":false},{"q":"不等式 x²+y²≦9 の表す領域を答えよ。","labels":["領域"],"a":["円の内部・境界を含む"],"e":"半径3の円の内部。","u":false},{"q":"不等式 x²+y²≦16 の表す領域を答えよ。","labels":["領域"],"a":["円の内部・境界を含む"],"e":"半径4の円の内部。","u":false},{"q":"不等式 x²+y²<25 の表す領域を答えよ。","labels":["領域"],"a":["円の内部・境界を含まない"],"e":"半径5の円の内部。","u":false},{"q":"不等式 x²+y²≧25 の表す領域を答えよ。","labels":["領域"],"a":["円の外部・境界を含む"],"e":"半径5の円の外部。","u":false},{"q":"不等式 x²+y²>4 の表す領域を答えよ。","labels":["領域"],"a":["円の外部・境界を含まない"],"e":"半径2の円の外部。","u":false}]},{"name":"連立不等式の表す領域","qs":[{"q":"連立不等式 y≧−2x+2，x²+y²≦9 の表す領域を答えよ。","labels":["領域"],"a":["直線の上側かつ円の内部"],"e":"y≧−2x+2 は、直線 y=−2x+2 の上側を表す。等号を含むので、直線は境界に含まれる。<br>x²+y²≦9 は、原点を中心とする半径3の円の内部を表す。等号を含むので、円周も境界に含まれる。<br>したがって、求める領域は「直線の上側」と「円の内部」の共通部分で、直線と円周はいずれも実線で表す。","u":false},{"q":"連立不等式 y≦x+2，x²+y²≦4 の表す領域を答えよ。","labels":["領域"],"a":["直線の下側かつ円の内部"],"e":"y≦x+2 は、直線 y=x+2 の下側を表す。等号を含むので、直線は境界に含まれる。<br>x²+y²≦4 は、原点を中心とする半径2の円の内部を表す。等号を含むので、円周も境界に含まれる。<br>したがって、求める領域は「直線の下側」と「円の内部」の共通部分で、直線と円周はいずれも実線で表す。","u":false},{"q":"連立不等式 y>x，x²+y²>1 の表す領域を答えよ。","labels":["領域"],"a":["直線の上側かつ円の外部"],"e":"y>x は、直線 y=x の上側を表す。等号を含まないので、直線は境界に含まれない。<br>x²+y²>1 は、原点を中心とする半径1の円の外部を表す。等号を含まないので、円周も境界に含まれない。<br>したがって、求める領域は「直線の上側」と「円の外部」の共通部分で、直線と円周はいずれも破線で表す。","u":false},{"q":"連立不等式 4x−y+2≧0，x²+y²≦9 の表す領域を答えよ。","labels":["領域"],"a":["直線の下側かつ円の内部"],"e":"4x−y+2≧0 を y≦4x+2 と変形する。したがって、直線 y=4x+2 の下側を表す。等号を含むので、直線は境界に含まれる。<br>x²+y²≦9 は、原点を中心とする半径3の円の内部を表す。等号を含むので、円周も境界に含まれる。<br>したがって、求める領域は「直線の下側」と「円の内部」の共通部分で、直線と円周はいずれも実線で表す。","u":false}]},{"name":"軌跡と方程式","qs":[{"q":"2点 O(0, '#entry').classList.add('hide');$('#fb').className='feedback '+(good?'ok':'ng');$('#fb').innerHTML='<b>'+(good?'✅ 正解！':'❌ 不正解')+'</b>'+regionFeedback(good)+renderRichMath(p.e)+'<br><button class="btn blue" onclick="after()">'+(streak>=3?'一覧へ':'次の問題')+'</button>';stats();renderUnitDiagrams($('#fb'));renderSolutionCircles($('#fb'));setTimeout(()=>$('#fb').scrollIntoView({behavior:'smooth',block:'center'}),30);return}if(vals.some(v=>!v))return;tries++;let good=ok();done=true;if(good){streak++;correct++}else streak=0;$('#entry').classList.add('hide');$('#fb').className='feedback '+(good?'ok':'ng');let wrong=good?'':('正しい答え：'+p.a.map(displayMath).join('，')+'<br>');$('#fb').innerHTML='<b>'+(good?'✅ 正解！':'❌ 不正解')+'</b><br>'+wrong+renderRichMath(p.e)+'<br><button class="btn blue" onclick="after()">'+(streak>=3?'一覧へ':'次の問題')+'</button>';stats();renderUnitDiagrams($('#fb'));renderSolutionCircles($('#fb'));setTimeout(()=>$('#fb').scrollIntoView({behavior:'smooth',block:'center'}),30)}function after(){streak>=3?goHome():newQ()}function stats(){$('#streak').textContent=streak+'/3';$('#correct').textContent=correct;$('#tries').textContent=tries;$('#bar').style.width=(streak/3*100)+'%'}
function radicalHTML(t){return String(t).replace(/√([0-9]+)/g,(m,body)=>`<span class="sqrt-view"><span class="sqrt-sign">√</span><span class="sqrt-body">${body}</span></span>`)}
function fractionHTML(num,den){return `<span class="frac-view"><span>${radicalHTML(num)}</span><i></i><span>${radicalHTML(den)}</span></span>`}
function canonicalFractionOrder(text){return String(text).replace(/\(([+\-−]?(?:√?\d+|\d+π))\)\/(\d+)/g,'$1/$2').replace(/([+\-−]?\d+)\/(\d+)π/g,'$1π/$2')}
function formatPlainMath(text){
 let parts=[],token='@@MFRAC';
 let t=canonicalFractionOrder(text);
 // 180°/π は、180°を分子、πを分母にした通常の分数で表示する。
 t=t.replace(/([+\-−]?\d+°)\/π/g,(m,num)=>{parts.push(fractionHTML(num,'π'));return token+(parts.length-1)+'@@'});
 // π/4 と π/9 は、πを分子に入れて表示する。
 t=t.replace(/(^|[^0-9π])([+\-−]?)π\/(4|9)(?!\d)/g,(m,pre,sign,den)=>{parts.push((sign||'')+fractionHTML('π',den));return pre+token+(parts.length-1)+'@@'});
 // それ以外の aπ/b は、a/b の分数の後ろに π を置いて表示する。
 t=t.replace(/([+\-−]?\d+)π\/(\d+)/g,(m,num,den)=>{parts.push(fractionHTML(num,den)+'π');return token+(parts.length-1)+'@@'});
 // π/4・π/9 以外の π/b も、1/b の後ろに π を置く。
 t=t.replace(/([+\-−]?)π\/(\d+)/g,(m,sign,den)=>{parts.push((sign||'')+fractionHTML('1',den)+'π');return token+(parts.length-1)+'@@'});
 // πを含まない通常の分数。
 t=t.replace(/([+\-−]?(?:\d*[a-zA-Zθ]+|\d+|√\d+|\d*√\d+[a-zA-Z]?))\/((?:√?\d+|[a-zA-Zθ]+))/g,(m,a,b)=>{parts.push(fractionHTML(a,b));return token+(parts.length-1)+'@@'});
 t=radicalHTML(t);
 return t.replace(/@@MFRAC(\d+)@@/g,(m,i)=>parts[Number(i)]);
}
function displayMath(v){return formatPlainMath(v)}
function renderSolutionCircles(root=document){root.querySelectorAll('.solution-circle:not([data-rendered])').forEach(box=>{box.dataset.rendered='1';let cx=210,cy=170,r=120,rays=(box.dataset.rays||'').split(',').filter(Boolean).map(Number);let pt=d=>[cx+r*Math.cos(d*Math.PI/180),cy-r*Math.sin(d*Math.PI/180)];let rayHTML=rays.map(d=>{let [x,y]=pt(d);return `<line class="ray" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><circle class="point" cx="${x}" cy="${y}" r="5"/>`}).join('');let arc='';let mode=box.dataset.mode;if(mode==='arc'){let a=Number(box.dataset.start),b=Number(box.dataset.end),p1=pt(a),p2=pt(b),large=((b-a+360)%360)>180?1:0;arc=`<path class="answer-arc" d="M ${p1[0]} ${p1[1]} A ${r} ${r} 0 ${large} 0 ${p2[0]} ${p2[1]}"/>`}else if(mode==='outside'){let p1=pt(300),p2=pt(60);arc=`<path class="answer-arc" d="M ${p1[0]} ${p1[1]} A ${r} ${r} 0 0 0 ${cx+r} ${cy} A ${r} ${r} 0 0 0 ${p2[0]} ${p2[1]}"/>`}box.innerHTML=`<svg viewBox="0 0 420 340"><circle class="circle" cx="${cx}" cy="${cy}" r="${r}"/><line class="axis" x1="35" y1="${cy}" x2="390" y2="${cy}"/><line class="axis" x1="${cx}" y1="20" x2="${cx}" y2="320"/>${arc}${rayHTML}<text x="388" y="${cy-8}">x</text><text x="${cx+8}" y="25">y</text><text x="18" y="326">${box.dataset.label||''}</text></svg>`})}

function renderRichMath(html){return String(html).split(/(<[^>]+>)/g).map(part=>part.startsWith('<')?part:formatPlainMath(part)).join('')}

const memo=$('#memo'),ctx=memo.getContext('2d');let strokes=[],stroke,drawing=false,color='#172033',width=3;function sizeMemo(){let box=$('#memoBox'),r=box.getBoundingClientRect(),unit=box.classList.contains('unit');memo.style.height=unit?Math.max(260,Math.min(440,r.width*.88))+'px':'240px';let rr=memo.getBoundingClientRect(),d=devicePixelRatio||1;memo.width=rr.width*d;memo.height=rr.height*d;ctx.setTransform(d,0,0,d,0,0);redraw()}function resetMemo(){strokes=[];setTimeout(sizeMemo,50)}function pos(e){let r=memo.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}function redraw(){let r=memo.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!$('#memoBox').classList.contains('unit')){ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}strokes.forEach(s=>{if(s.p.length<2)return;ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...s.p[0]);s.p.slice(1).forEach(q=>ctx.lineTo(...q));ctx.stroke()})}memo.onpointerdown=e=>{memo.setPointerCapture(e.pointerId);drawing=true;stroke={c:color,w:width,p:[pos(e)]};strokes.push(stroke)};memo.onpointermove=e=>{if(drawing){stroke.p.push(pos(e));redraw()}};memo.onpointerup=()=>drawing=false;memo.onpointercancel=()=>drawing=false;function pen(c,w){color=c;width=w}function undoMemo(){strokes.pop();redraw()}function clearMemo(){strokes=[];redraw()}function toggleMemo(){$('#memoArea').classList.toggle('hide');if(!$('#memoArea').classList.contains('hide'))sizeMemo()}window.addEventListener('resize',sizeMemo);render();
