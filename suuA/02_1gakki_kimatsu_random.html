<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学A 1学期期末考査対策 〜確率クロニクル〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080f;
  --card:#12121e;
  --card2:#1a1a2e;
  --gold:#f0c040;
  --blue:#3b82f6;
  --purple:#a855f7;
  --green:#22c55e;
  --red:#ef4444;
  --text:#e9e9f4;
  --sub:#9090ad;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; height:100vh; height:100dvh; width:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  position:relative;
}
.game{
  font-family:'DotGothic16',sans-serif;
}
#starfield{
  position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
}
.star{
  position:absolute; background:#fff; border-radius:50%;
  opacity:.7; animation:twinkle linear infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.15;}
  50%{opacity:.9;}
}
#app{
  position:relative; z-index:1;
  height:100vh; height:100dvh; width:100%;
  max-width:560px; margin:0 auto;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.screen{
  flex:1; display:none; flex-direction:column;
  height:100%; width:100%;
  padding:14px; overflow:hidden;
}
.screen.active{ display:flex; }

/* ---------- TITLE ---------- */
#titleScreen{ align-items:center; justify-content:center; text-align:center; gap:18px; }
.title-emoji-row{
  font-size:46px; letter-spacing:6px;
  animation:floaty 3s ease-in-out infinite;
}
@keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
.game-title{
  font-family:'DotGothic16',sans-serif;
  font-size:26px; color:var(--gold);
  text-shadow:0 0 12px rgba(240,192,64,.55), 0 0 2px #000;
  line-height:1.5; letter-spacing:1px;
}
.game-subtitle{ font-size:13px; color:var(--sub); line-height:1.8; max-width:380px; }
.title-stat-box{
  background:var(--card); border:1px solid #2a2a40; border-radius:12px;
  padding:12px 18px; font-size:12.5px; color:var(--sub); line-height:1.9;
}
.title-stat-box b{ color:var(--gold); }
.btn{
  font-family:'DotGothic16',sans-serif;
  border:none; cursor:pointer; border-radius:14px;
  padding:14px 34px; font-size:17px; font-weight:700;
  background:linear-gradient(180deg,var(--gold),#c89320);
  color:#1a1206;
  box-shadow:0 4px 0 #8a6a16, 0 6px 14px rgba(0,0,0,.4);
  transition:transform .08s;
  letter-spacing:1px;
}
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a6a16; }
.btn.secondary{
  background:linear-gradient(180deg,#3b4257,#262c3d);
  color:var(--text);
  box-shadow:0 4px 0 #15192599, 0 6px 14px rgba(0,0,0,.4);
}
.btn.purple{
  background:linear-gradient(180deg,var(--purple),#7a2fc4);
  color:#fff;
  box-shadow:0 4px 0 #5a1f8f, 0 6px 14px rgba(0,0,0,.4);
}

/* ---------- HUD ---------- */
#hud{
  display:flex; flex-direction:column; gap:6px; margin-bottom:8px; flex-shrink:0;
}
.hud-top-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px; }
.badge{
  background:var(--card2); border:1px solid #33334d; border-radius:8px;
  padding:3px 9px; font-size:11px; color:var(--gold); white-space:nowrap;
}
.hud-bars{ display:flex; flex-direction:column; gap:4px; }
.bar-row{ display:flex; align-items:center; gap:6px; }
.bar-label{ font-size:10px; width:34px; flex-shrink:0; color:var(--sub); }
.bar-track{
  flex:1; height:11px; background:#1c1c2c; border-radius:6px; overflow:hidden;
  border:1px solid #2c2c42; position:relative;
}
.bar-fill{ height:100%; border-radius:6px; transition:width .4s ease; }
.bar-fill.hero{ background:linear-gradient(90deg,#22c55e,#4ade80); }
.bar-fill.enemy{ background:linear-gradient(90deg,#ef4444,#f87171); }
.hud-mid-row{ display:flex; justify-content:space-between; align-items:center; font-size:11px; }
.combo-display{
  color:var(--purple); font-weight:700; font-size:12px; min-height:14px;
}
.coin-hint-row{ display:flex; align-items:center; gap:6px; }
.coin-count{ color:var(--gold); font-size:12px; }
.hint-btn{
  font-family:'DotGothic16',sans-serif;
  background:var(--card2); border:1px solid var(--blue); color:var(--blue);
  border-radius:8px; padding:4px 10px; font-size:11px; cursor:pointer;
}
.hint-btn:disabled{ opacity:.35; color:var(--sub); border-color:#444; cursor:default; }

/* ---------- BATTLE ---------- */
#battleScreen{ gap:8px; }
.enemy-area{
  position:relative; flex-shrink:0;
  background:radial-gradient(ellipse at center, #1c1c34 0%, #0c0c16 80%);
  border-radius:14px; border:1px solid #26263d;
  padding:10px; text-align:center; min-height:108px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
.enemy-area.boss{ border-color:var(--gold); box-shadow:0 0 18px rgba(240,192,64,.25) inset; }
.enemy-name-row{ font-size:12px; color:var(--gold); margin-bottom:2px; }
.enemy-emoji{ font-size:42px; line-height:1; transition:transform .15s; }
.enemy-emoji.shake{ animation:shake .35s; }
.enemy-emoji.dying{ animation:diePop .6s forwards; }
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px) rotate(-6deg);}
  40%{transform:translateX(8px) rotate(6deg);}
  60%{transform:translateX(-6px) rotate(-4deg);}
  80%{transform:translateX(6px) rotate(4deg);}
}
@keyframes diePop{
  0%{transform:scale(1); opacity:1;}
  60%{transform:scale(1.3); opacity:.7;}
  100%{transform:scale(0.2) rotate(25deg); opacity:0;}
}
@keyframes enemyEnter{
  0%{transform:translateY(-30px) scale(.6); opacity:0;}
  100%{transform:translateY(0) scale(1); opacity:1;}
}
.enemy-emoji.enter{ animation:enemyEnter .45s ease-out; }
.enemy-bar-wrap{ width:80%; margin-top:6px; }
.boss-tag{
  position:absolute; top:6px; left:50%; transform:translateX(-50%);
  background:var(--gold); color:#1a1206; font-size:10px; font-weight:700;
  padding:1px 10px; border-radius:8px; letter-spacing:2px;
}
#flash{
  position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50;
}
#flash.go{ animation:flashAnim .3s; }
@keyframes flashAnim{ 0%{opacity:.85;} 100%{opacity:0;} }

.battle-log{
  background:#0c0c16; border:1px solid #22223a; border-radius:8px;
  padding:6px 10px; font-size:11.5px; color:#c8c8e0; min-height:36px;
  display:flex; flex-direction:column; justify-content:center; gap:2px;
  flex-shrink:0;
}
.battle-log .log-line{ opacity:.85; }
.battle-log .log-line.new{ color:var(--gold); opacity:1; }

.combo-banner{
  position:fixed; top:40%; left:50%; transform:translate(-50%,-50%) scale(0.5);
  font-family:'DotGothic16',sans-serif; font-size:30px; color:var(--purple);
  text-shadow:0 0 14px rgba(168,85,247,.8); opacity:0; pointer-events:none; z-index:60;
}
.combo-banner.show{ animation:comboPop .8s ease-out; }
@keyframes comboPop{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
  25%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}
  40%{transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0; transform:translate(-50%,-60%) scale(1);}
}

.question-area{
  flex:1; display:flex; flex-direction:column; gap:10px; min-height:0;
  overflow-y:auto;
}
.q-card{
  background:var(--card); border:1px solid #25253c; border-radius:14px;
  padding:14px; flex-shrink:0;
}
.q-num{ font-size:11px; color:var(--sub); margin-bottom:4px; }
.q-text{ font-size:15px; line-height:1.7; font-family:'Noto Sans JP',sans-serif; color:var(--text); }
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 2px; }
.fr .n{ border-bottom:1.5px solid currentColor; padding:0 6px 2px; }
.fr .d{ padding:2px 6px 0; }

.choices4{ display:flex; flex-direction:column; gap:8px; }
.choice-btn{
  font-family:'Noto Sans JP',sans-serif;
  display:flex; align-items:center; gap:10px;
  background:var(--card2); border:1.5px solid #2e2e48; border-radius:11px;
  padding:11px 14px; font-size:15px; color:var(--text); cursor:pointer; text-align:left;
}
.choice-btn .pfx{ color:var(--blue); font-weight:700; font-family:'DotGothic16',sans-serif; flex-shrink:0; }
.choice-btn:active{ transform:scale(.98); }
.choice-btn.correct{ border-color:var(--green); background:rgba(34,197,94,.16); }
.choice-btn.wrong{ border-color:var(--red); background:rgba(239,68,68,.16); }
.choice-btn.grayed{ opacity:.3; pointer-events:none; text-decoration:line-through; }
.choice-btn:disabled{ pointer-events:none; }

.numpad-wrap{ display:flex; flex-direction:column; gap:10px; }
.numpad-display{
  background:#0c0c16; border:1.5px solid var(--blue); border-radius:10px;
  font-family:'DotGothic16',sans-serif; font-size:24px; text-align:right;
  padding:10px 16px; min-height:24px; color:var(--gold); letter-spacing:1px;
}
.numpad-display .unit{ font-size:14px; color:var(--sub); margin-left:4px; font-family:'Noto Sans JP',sans-serif; }
.numpad-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.num-btn{
  font-family:'DotGothic16',sans-serif;
  background:var(--card2); border:1.5px solid #2e2e48; border-radius:10px;
  padding:13px 0; font-size:18px; color:var(--text); cursor:pointer;
}
.num-btn:active{ transform:scale(.95); }
.num-btn.wide{ grid-column:span 1; }
.num-btn.fn{ color:var(--blue); }
.num-btn.go{ background:linear-gradient(180deg,var(--gold),#c89320); color:#1a1206; font-weight:700; }

/* ---------- RESULT ---------- */
#resultScreen{ align-items:center; justify-content:flex-start; text-align:center; gap:10px; padding-top:24px; overflow-y:auto;}
.result-icon{ font-size:54px; }
.result-icon.ok{ animation:popIn .4s; }
.result-icon.ng{ animation:shakeOnce .4s; }
@keyframes popIn{ 0%{transform:scale(0);} 60%{transform:scale(1.25);} 100%{transform:scale(1);} }
@keyframes shakeOnce{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
.result-title{ font-family:'DotGothic16',sans-serif; font-size:20px; }
.result-title.ok{ color:var(--green); }
.result-title.ng{ color:var(--red); }
.result-dmg{ font-size:12px; color:var(--sub); margin-bottom:4px;}
.explain-card{
  background:var(--card); border:1px solid #25253c; border-radius:14px;
  padding:14px; text-align:left; font-size:13.5px; line-height:1.8; color:#d2d2e6;
  font-family:'Noto Sans JP',sans-serif; width:100%;
}
.explain-card .lbl{ color:var(--gold); font-weight:700; font-size:12px; margin-bottom:4px; }
.correct-answer-line{ font-size:13px; color:var(--green); margin-bottom:6px; font-family:'Noto Sans JP',sans-serif;}

/* ---------- CLEAR / GAMEOVER ---------- */
#clearScreen, #gameoverScreen, #stageClearScreen{
  align-items:center; justify-content:center; text-align:center; gap:14px; overflow-y:auto;
}
.clear-banner{
  font-family:'DotGothic16',sans-serif; font-size:24px; color:var(--gold);
  text-shadow:0 0 14px rgba(240,192,64,.5);
}
.clear-banner.over{ color:var(--red); text-shadow:0 0 14px rgba(239,68,68,.5); }
.score-box{
  background:var(--card); border:1px solid #2a2a40; border-radius:14px;
  padding:16px 26px; font-size:14px; line-height:2.1; color:var(--text);
}
.score-box b{ color:var(--gold); font-size:17px; }
.title-grant{ font-size:13px; color:var(--purple); }
.badge-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  width:100%; max-width:340px;
}
.ach{
  background:var(--card2); border:1.5px solid #33334d; border-radius:12px;
  padding:10px 4px; font-size:10.5px; color:var(--sub);
}
.ach.got{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 8px rgba(240,192,64,.3); }
.ach .ico{ font-size:22px; display:block; margin-bottom:3px; }
.stagebar{
  width:100%; max-width:340px; background:var(--card2); border-radius:8px; height:8px; overflow:hidden; border:1px solid #2e2e48;
}
.stagebar-fill{ height:100%; background:linear-gradient(90deg,var(--blue),var(--purple)); }
.small-sub{ font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<div id="starfield"></div>
<div id="flash"></div>
<div class="combo-banner" id="comboBanner"></div>

<div id="app" class="game">

  <!-- TITLE -->
  <div class="screen active" id="titleScreen">
    <div class="title-emoji-row">🎲🃏🪙</div>
    <div class="game-title">数学A　1学期期末考査対策<br>〜確率クロニクル〜</div>
    <div class="game-subtitle">場合の数・確率の全32問に挑み、頂点「確率大魔王」を打ち倒せ。</div>
    <div class="title-stat-box" id="titleStats">問題を準備中…</div>
    <button class="btn" id="startBtn">ゲームスタート</button>
  </div>

  <!-- BATTLE -->
  <div class="screen" id="battleScreen">
    <div id="hud">
      <div class="hud-top-row">
        <span class="badge" id="lvBadge">Lv.1 見習い挑戦者</span>
        <span class="badge" id="scoreBadge">SCORE 0/0</span>
        <span class="badge" id="stageBadge">STAGE 1</span>
      </div>
      <div class="hud-bars">
        <div class="bar-row">
          <span class="bar-label">勇者</span>
          <div class="bar-track"><div class="bar-fill hero" id="heroBar" style="width:100%"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">敵</span>
          <div class="bar-track"><div class="bar-fill enemy" id="enemyBarHud" style="width:100%"></div></div>
        </div>
      </div>
      <div class="hud-mid-row">
        <span class="combo-display" id="comboDisplay"></span>
        <div class="coin-hint-row">
          <span class="coin-count" id="coinCount">🪙0</span>
          <button class="hint-btn" id="hintBtn">💡ヒント(1枚)</button>
        </div>
      </div>
    </div>

    <div class="enemy-area" id="enemyArea">
      <div class="boss-tag" id="bossTag" style="display:none;">BOSS</div>
      <div class="enemy-name-row" id="enemyNameRow">サイコロドット Lv.1</div>
      <div class="enemy-emoji" id="enemyEmoji">🎲</div>
      <div class="enemy-bar-wrap">
        <div class="bar-track"><div class="bar-fill enemy" id="enemyBar" style="width:100%"></div></div>
      </div>
    </div>

    <div class="battle-log" id="battleLog">
      <div class="log-line">バトル開始！正解して敵にダメージを与えよう。</div>
    </div>

    <div class="question-area" id="questionArea"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="resultScreen">
    <div class="result-icon" id="resultIcon">⭕</div>
    <div class="result-title" id="resultTitle">せいかい！</div>
    <div class="result-dmg" id="resultDmg"></div>
    <div class="explain-card">
      <div class="correct-answer-line" id="correctAnswerLine"></div>
      <div class="lbl">📖 解説</div>
      <div id="explainText"></div>
    </div>
    <button class="btn" id="nextBtn">次へ</button>
  </div>

  <!-- STAGE CLEAR -->
  <div class="screen" id="stageClearScreen">
    <div class="clear-banner">STAGE CLEAR！</div>
    <div class="score-box" id="stageScoreBox"></div>
    <div class="small-sub" id="stageRemain">残り◯問！続きに挑戦しよう！</div>
    <div class="stagebar"><div class="stagebar-fill" id="stageProgressFill" style="width:0%"></div></div>
    <button class="btn" id="continueBtn">続きに挑戦する</button>
  </div>

  <!-- ALL CLEAR -->
  <div class="screen" id="clearScreen">
    <div class="clear-banner">🎉 全問クリア！</div>
    <div class="small-sub">数式魔王を完全封印した！</div>
    <div class="score-box" id="clearScoreBox"></div>
    <div class="title-grant" id="titleGrant"></div>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn" id="restartAllBtn">最初からやり直す</button>
  </div>

  <!-- GAME OVER -->
  <div class="screen" id="gameoverScreen">
    <div class="clear-banner over">GAME OVER…</div>
    <div class="small-sub">勇者は力尽きてしまった…</div>
    <div class="score-box" id="overScoreBox"></div>
    <button class="btn purple" id="retryChunkBtn">このステージをやり直す</button>
    <button class="btn secondary" id="restartAllBtn2">最初からやり直す</button>
  </div>

</div>

<script>
const PROBLEMS = [
{
"id": 1,
"title": "数え上げを用いる確率：1個のさいころ",
"enemy": {
"name": "サイコロドット",
"emoji": "🎲",
"lv": 1
},
"reward": "数え上げの確率をマスター！",
"boss": false,
"subs": [
{
"q": "1個のさいころを投げるとき、4以下の目が出る確率を求めよ。",
"type": "choice4",
"choices": [
"2/3",
"1/2",
"1/3",
"5/6"
],
"answer": 0,
"e": "起こりうるすべての目の出方は6通り。4以下の目は1,2,3,4の4通りだから、求める確率は <span class=\"fr\"><span class=\"n\">4</span><span class=\"d\">6</span></span>=<span class=\"fr\"><span class=\"n\">2</span><span class=\"d\">3</span></span>。"
},
{
"q": "1個のさいころを投げるとき、3の倍数の目が出る確率を求めよ。",
"type": "choice4",
"choices": [
"1/3",
"1/2",
"2/3",
"1/6"
],
"answer": 0,
"e": "3の倍数の目は3,6の2通り。よって求める確率は <span class=\"fr\"><span class=\"n\">2</span><span class=\"d\">6</span></span>=<span class=\"fr\"><span class=\"n\">1</span><span class=\"d\">3</span></span>。"
},
{
"q": "1個のさいころを投げるとき、6の約数の目が出る確率を求めよ。",
"type": "choice4",
"choices": [
"2/3",
"1/2",
"1/3",
"5/6"
],
"answer": 0,
"e": "6の約数は1,2,3,6の4通り。よって求める確率は <span class=\"fr\"><span class=\"n\">4</span><span class=\"d\">6</span></span>=<span class=\"fr\"><span class=\"n\">2</span><span class=\"d\">3</span></span>。"
}
]
},
{
"id": 2,
"title": "数え上げを用いる確率：玉を取り出す",
"enemy": {
"name": "アカダマゴブリン",
"emoji": "🔴",
"lv": 1
},
"reward": "玉を取り出す確率をマスター！",
"boss": false,
"subs": [
{
"q": "赤玉2個と白玉4個の入った袋から、玉を1個取り出すとき、白玉の出る確率を求めよ。",
"type": "choice4",
"choices": [
"2/3",
"1/3",
"1/2",
"5/6"
],
"answer": 0,
"e": "袋に入っている玉は全部で6個。白玉の出る確率は <span class=\"fr\"><span class=\"n\">4</span><span class=\"d\">6</span></span>=<span class=\"fr\"><span class=\"n\">2</span><span class=\"d\">3</span></span>。"
}
]
},
{
"id": 3,
"title": "数え上げを用いる確率：4枚の硬貨",
"enemy": {
"name": "コインスピナー",
"emoji": "🪙",
"lv": 2
},
"reward": "反復事象の数え上げをマスター！",
"boss": false,
"subs": [
{
"q": "4枚の硬貨を同時に投げるとき、すべて裏が出る確率を求めよ。",
"type": "choice4",
"choices": [
"1/16",
"1/8",
"1/4",
"1/2"
],
"answer": 0,
"e": "起こりうる場合の数は2<sup>4</sup>=16通り。すべて裏が出るのは1通りだから、求める確率は<span class=\"fr\"><span class=\"n\">1</span><span class=\"d\">16</span></span>。"
},
{
"q": "4枚の硬貨を同時に投げるとき、1枚だけ表が出る確率を求めよ。",
"type": "choice4",
"choices": [
"1/4",

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
function fmtVal(str){
  // formats a value string like "2/3" or "60" into display HTML using fraction styling
  if(str.indexOf('/') !== -1){
    const [n,d] = str.split('/');
    return `<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
  }
  return str;
}
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function atkFor(id){ return Math.min(6, 3 + Math.floor((id-1)/8)); }

/* Balanced placement of the correct answer across ア/イ/ウ/エ.
   Tracks how many times each position has held the correct answer so far
   in this playthrough, and always assigns the next correct answer to one
   of the least-used positions (chosen randomly among ties). This keeps the
   distribution close to even (unlike pure independent shuffling, which can
   show visible streaks over a few dozen questions) while still being
   unpredictable to the player. */
let posCount = [0,0,0,0];
function pickBalancedPosition(){
  const minCount = Math.min(...posCount);
  const candidates = [0,1,2,3].filter(p=>posCount[p]===minCount);
  const chosen = candidates[Math.floor(Math.random()*candidates.length)];
  posCount[chosen]++;
  return chosen;
}

/* ---------------- build full queue (problem order randomized each playthrough) ----------------
   The boss (問32) is always kept as the final encounter so the run still
   builds to a climax, but the other 31 problems are shuffled into a fresh
   order every time the game starts/restarts. */
function buildFullQueue(){
  const nonBoss = PROBLEMS.filter(p=>!p.boss);
  const boss = PROBLEMS.filter(p=>p.boss);
  const orderedProblems = [...shuffleArr([...nonBoss]), ...boss];
  const q = [];
  orderedProblems.forEach(prob=>{
    prob.maxHp = prob.subs.length;
    prob.subs.forEach((sub,subIndex)=>{
      q.push({prob, sub, subIndex});
    });
  });
  return q;
}
let fullQueue = buildFullQueue();

const CHUNK_SIZE = 12;
function calcChunkEnd(start){
  const total = fullQueue.length;
  let end = Math.min(start + CHUNK_SIZE, total);
  if(end < total){
    const endProbId = fullQueue[end].prob.id;
    if(fullQueue[end-1].prob.id === endProbId){
      while(end < total && fullQueue[end].prob.id === endProbId) end++;
    }
  }
  return Math.min(end, total);
}

let currentAnswerIdx=0;

/* ---------------- chunk start ---------------- */
function startChunk(start){
  chunkStart = start;
  chunkEnd = calcChunkEnd(start);
  queue = fullQueue.slice(chunkStart, chunkEnd);
  idx = 0;
  heroMax = queue.length * 3;
  heroHp = heroMax;
  score = 0; answered = 0; combo = 0; maxCombo = 0; coins = 0;
  hintUsedAnyThisChunk = false; heroHitThisChunk = false;
  enemyObj = null;
  gameOverFromChunkStart = start;
  updateHud();
}

function currentItem(){ return queue[idx]; }

function spawnEnemyIfNeeded(){
  const item = currentItem();
  if(!enemyObj || enemyObj.prob.id !== item.prob.id){
    enemyObj = { prob:item.prob, hp:item.prob.maxHp, max:item.prob.maxHp };
    const isBoss = item.prob.boss;
    $('bossTag').style.display = isBoss ? 'flex':'none';
    $('enemyArea').classList.toggle('boss', isBoss);
    $('enemyNameRow').textContent = `${item.prob.enemy.name} Lv.${item.prob.enemy.lv}`;
    $('enemyEmoji').textContent = item.prob.enemy.emoji;
    $('enemyEmoji').classList.remove('enter');
    void $('enemyEmoji').offsetWidth;
    $('enemyEmoji').classList.add('enter');
    logBattle(`${item.prob.enemy.emoji} ${item.prob.enemy.name} が現れた！`, true);
  }
  updateEnemyBar();
}

function updateEnemyBar(){
  const pct = Math.max(0, (enemyObj.hp/enemyObj.max)*100);
  $('enemyBar').style.width = pct+'%';
  $('enemyBarHud').style.width = pct+'%';
}
function updateHeroBar(){
  const pct = Math.max(0,(heroHp/heroMax)*100);
  $('heroBar').style.width = pct+'%';
}
function updateHud(){
  $('scoreBadge').textContent = `SCORE ${score}/${queue.length}`;
  $('lvBadge').textContent = `Lv.${Math.min(13,answered+1)} ${levelTitle(score)}`;
  $('stageBadge').textContent = `STAGE ${stageNumber}`;
  $('coinCount').textContent = `🪙${coins}`;
  $('comboDisplay').textContent = combo>=2 ? `${combo} COMBO!` : '';
  updateHeroBar();
  if(enemyObj) updateEnemyBar();
  const item = queue[idx];
  const isChoice4 = item && item.sub.type === 'choice4';
  $('hintBtn').disabled = !isChoice4 || hintUsedThisSub || coins<1;
}

function logBattle(text, isNew){
  const log = $('battleLog');
  const prevTop = log.querySelector('.log-line.new');
  let html = '';
  if(prevTop){
    html += `<div class="log-line">${prevTop.textContent}</div>`;
  }

  log.innerHTML = html;
}

/* ---------------- question loading ---------------- */
function loadQuestion(){
  spawnEnemyIfNeeded();
  hintUsedThisSub = false;
  numpadInput = "";
  const item = currentItem();
  const sub = item.sub;
  const qArea = $('questionArea');

  let html = `<div class="q-card">
    <div class="q-num">問${item.prob.id}　${item.prob.title}　(${item.subIndex+1}/${item.prob.subs.length})</div>
    <div class="q-text">${sub.q}</div>
  </div>`;

  if(sub.type === 'choice4'){
    // sub.choices = [correct, distractor1, distractor2, distractor3] (correct is always source index 0)
    const correctPos = pickBalancedPosition();
    const distractorIdxs = shuffleArr([1,2,3]);
    const order = [0,0,0,0];
    order[correctPos] = 0;
    let di = 0;
    for(let pos=0; pos<4; pos++){
      if(pos===correctPos) continue;
      order[pos] = distractorIdxs[di]; di++;
    }
    currentChoiceOrder = order;
    currentAnswerIdx = correctPos;
    const prefixes = ['ア','イ','ウ','エ'];
    html += `<div class="choices4" id="choicesWrap">`;
    order.forEach((origIdx, pos)=>{
      html += `<button class="choice-btn" data-pos="${pos}" id="cb${pos}">
        <span class="pfx">${prefixes[pos]}</span><span>${fmtVal(sub.choices[origIdx])}</span>
      </button>`;
    });
    html += `</div>`;
  } else if(sub.type === 'numpad'){
    html += `<div class="numpad-wrap">
      <div class="numpad-display"><span id="numpadVal">0</span><span class="unit">円</span></div>
      <div class="numpad-grid" id="numpadGrid">
        ${['7','8','9','4','5','6','1','2','3'].map(n=>`<button class="num-btn" data-n="${n}">${n}</button>`).join('')}
        <button class="num-btn fn" data-n="back">⌫</button>
        <button class="num-btn" data-n="0">0</button>
        <button class="num-btn go" data-n="ok">確定</button>
      </div>
    </div>`;
  }

  qArea.innerHTML = html;
  qArea.scrollTop = 0;

  if(sub.type === 'choice4'){
    document.querySelectorAll('#choicesWrap .choice-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> submitChoice(parseInt(btn.dataset.pos)));
    });
  } else {
    updateNumpadDisplay();
    document.querySelectorAll('#numpadGrid .num-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> handleNumpad(btn.dataset.n));
    });
  }
  updateHud();
}

function updateNumpadDisplay(){
  $('numpadVal').textContent = numpadInput.length ? numpadInput : '0';
}
function handleNumpad(n){
  if(n==='back'){ numpadInput = numpadInput.slice(0,-1); }
  else if(n==='ok'){ submitNumpad(); return; }
  else{
    if(numpadInput.length<6) numpadInput += n;
  }
  updateNumpadDisplay();
}

/* ---------------- hint ---------------- */
$('hintBtn').addEventListener('click', ()=>{
  if(hintUsedThisSub || coins<1) return;
  const item = currentItem();
  if(item.sub.type !== 'choice4') return;
  coins -= 1;
  hintUsedThisSub = true;
  hintUsedAnyThisChunk = true;
  const wrongPositions = currentChoiceOrder.map((_,pos)=>pos).filter(pos=>pos!==currentAnswerIdx);
  const target = wrongPositions[Math.floor(Math.random()*wrongPositions.length)];
  const btn = $('cb'+target);
  if(btn) btn.classList.add('grayed');
  updateHud();
});

/* ---------------- submit answer ---------------- */
function submitChoice(pos){
  document.querySelectorAll('#choicesWrap .choice-btn').forEach(b=>b.disabled=true);
  const correct = pos === currentAnswerIdx;
  if(correct) $('cb'+pos).classList.add('correct');
  else{
    $('cb'+pos).classList.add('wrong');
    $('cb'+currentAnswerIdx).classList.add('correct');
  }
  resolveAnswer(correct);
}
function submitNumpad(){
  const item = currentItem();
  const correct = numpadInput.length>0 && numpadInput === item.sub.ans;
  resolveAnswer(correct);
}

function resolveAnswer(correct){
  const item = currentItem();
  answered++;
  let dmgText = '';
  if(correct){
    score++;
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    enemyObj.hp = Math.max(0, enemyObj.hp-1);
    updateEnemyBar();
    $('enemyEmoji').classList.add('shake');
    setTimeout(()=>$('enemyEmoji').classList.remove('shake'),350);
    const coinGain = combo>=5 ? 3 : combo>=3 ? 2 : 1;
    coins += coinGain;
    dmgText = `${item.prob.enemy.name}に1ダメージ！ (🪙+${coinGain})`;
    logBattle(`⚔️ ${dmgText}`, true);
    if(combo===5 || combo===10){
      flashCombo(`${combo} COMBO!!`);
    }
    if(enemyObj.hp<=0){
      $('enemyEmoji').classList.add('dying');
      setTimeout(()=>{
        $('enemyEmoji').classList.remove('dying');
      },600);
    }
  } else {
    combo = 0;
    const dmg = atkFor(item.prob.id);
    heroHp = Math.max(0, heroHp-dmg);
    heroHitThisChunk = true;
    updateHeroBar();
    flashScreen();
    dmgText = `${dmg}ダメージを受けた…`;
    logBattle(`💥 ${dmgText}`, true);
  }
  updateHud();

  // populate result screen
  $('resultIcon').textContent = correct ? '⭕' : '❌';
  $('resultIcon').className = 'result-icon ' + (correct?'ok':'ng');
  $('resultTitle').textContent = correct ? 'せいかい！' : 'ざんねん…';
  $('resultTitle').className = 'result-title ' + (correct?'ok':'ng');
  $('resultDmg').textContent = dmgText;

  const sub = item.sub;
  let answerLine = '';
  if(sub.type === 'choice4'){
    answerLine = `正解：${fmtVal(sub.choices[sub.answer])}`;
  } else {
    answerLine = `正解：${sub.ans}円`;
  }
  $('correctAnswerLine').innerHTML = answerLine;
  $('explainText').innerHTML = sub.e;

  setTimeout(()=>{ showScreen('resultScreen'); }, correct ? 450 : 250);
}

function flashScreen(){
  const f = $('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
function flashCombo(text){
  const b = $('comboBanner');
  b.textContent = text;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

/* ---------------- next button ---------------- */
$('nextBtn').addEventListener('click', ()=>{
  if(heroHp<=0){
    showGameOver();
    return;
  }
  idx++;
  if(idx >= queue.length){
    showStageOrAllClear();
    return;
  }
  loadQuestion();
  showScreen('battleScreen');
});

/* ---------------- stage clear / all clear ---------------- */
function computeAchievements(){
  return [
    {id:'perfect', name:'パーフェクト', emoji:'👑', got: score===queue.length},
    {id:'noHit', name:'ノーダメージ', emoji:'🛡', got: !heroHitThisChunk},
    {id:'combo5', name:'コンボマスター', emoji:'🔥', got: maxCombo>=5},
    {id:'rich', name:'コイン長者', emoji:'🪙', got: coins>=10},
    {id:'noHint', name:'ヒント不要', emoji:'💡', got: !hintUsedAnyThisChunk},
    {id:'survivor', name:'ぎりぎり生還', emoji:'❤', got: heroHp>0 && heroHp<=Math.ceil(heroMax*0.12)},
  ];
}

function showStageOrAllClear(){
  const isAllDone = (chunkEnd >= fullQueue.length);
  if(isAllDone){
    $('clearScoreBox').innerHTML = `SCORE <b>${score} / ${queue.length}</b><br>正答率 ${Math.round(score/queue.length*100)}%<br>最大コンボ ${maxCombo}　獲得コイン🪙${coins}`;
    $('titleGrant').textContent = `称号「${levelTitle(score)}」を獲得！`;
    const ach = computeAchievements();
    $('badgeGrid').innerHTML = ach.map(a=>`
      <div class="ach ${a.got?'got':''}">
        <span class="ico">${a.emoji}</span>${a.name}
      </div>`).join('');
    showScreen('clearScreen');
  } else {
    $('stageScoreBox').innerHTML = `今回のSCORE <b>${score} / ${queue.length}</b><br>最大コンボ ${maxCombo}　獲得コイン🪙${coins}`;
    const remain = fullQueue.length - chunkEnd;
    $('stageRemain').textContent = `残り${remain}問！続きに挑戦しよう！`;
    $('stageProgressFill').style.width = Math.round(chunkEnd/fullQueue.length*100)+'%';
    showScreen('stageClearScreen');
  }
}

$('continueBtn').addEventListener('click', ()=>{
  stageNumber++;
  startChunk(chunkEnd);
  loadQuestion();
  showScreen('battleScreen');
});

/* ---------------- game over ---------------- */
function showGameOver(){
  $('overScoreBox').innerHTML = `今回のSCORE <b>${score} / ${queue.length}</b><br>このステージの先頭からもう一度挑戦しよう！`;
  showScreen('gameoverScreen');
}
$('retryChunkBtn').addEventListener('click', ()=>{
  startChunk(gameOverFromChunkStart);
  loadQuestion();
  showScreen('battleScreen');
});

function restartAll(){
  stageNumber = 1;
  posCount = [0,0,0,0];
  fullQueue = buildFullQueue();
  startChunk(0);
  showScreen('titleScreen');
}
$('restartAllBtn').addEventListener('click', restartAll);
$('restartAllBtn2').addEventListener('click', restartAll);
</script>
</body>
</html>
